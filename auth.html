<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI生图平台 - 账号登录</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
        body{background:linear-gradient(135deg,#667eea 0,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        .container{width:100%;max-width:420px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.2);overflow:hidden;}
        .header{padding:30px;text-align:center;background:linear-gradient(135deg,#667eea 0,#764ba2 100%);color:#fff;}
        .header h1{font-size:28px;margin-bottom:8px;}
        .header p{font-size:14px;opacity:0.9;}
        .tabs{display:flex;border-bottom:1px solid #eee;}
        .tab{flex:1;padding:15px;text-align:center;cursor:pointer;font-size:16px;color:#666;transition:all 0.3s;}
        .tab.active{color:#667eea;border-bottom:3px solid #667eea;font-weight:bold;}
        .form-container{padding:30px;}
        .form-item{display:none;}
        .form-item.active{display:block;animation:fadeIn 0.3s;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
        .input-group{margin-bottom:20px;}
        .input-group label{display:block;margin-bottom:8px;color:#333;font-size:14px;}
        .input-group input{width:100%;padding:12px 15px;border:1px solid #ddd;border-radius:8px;font-size:16px;transition:border 0.3s;}
        .input-group input:focus{outline:none;border-color:#667eea;}
        .code-input{display:flex;gap:10px;}
        .code-input input{flex:1;}
        .code-input button{width:120px;white-space:nowrap;padding:12px 10px;border:none;border-radius:8px;background:#667eea;color:#fff;font-size:14px;cursor:pointer;transition:background 0.3s;}
        .code-input button:disabled{background:#ccc;cursor:not-allowed;}
        .cf-box{margin-bottom:20px;display:flex;justify-content:center;}
        .btn{width:100%;padding:14px;border:none;border-radius:8px;background:linear-gradient(135deg,#667eea 0,#764ba2 100%);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;transition:transform 0.2s;}
        .btn:hover{transform:translateY(-2px);}
        .btn:disabled{background:#ccc;cursor:not-allowed;transform:none;}
        .tip{text-align:center;margin-top:20px;font-size:14px;color:#666;}
        .tip a{color:#667eea;cursor:pointer;text-decoration:none;}
        .message{padding:12px;border-radius:8px;margin-bottom:20px;font-size:14px;display:none;}
        .message.success{background:#e8f5e9;color:#2e7d32;display:block;}
        .message.error{background:#ffebee;color:#c62828;display:block;}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI生图平台</h1>
            <p>用AI创作无限可能</p>
        </div>
        <div class="tabs">
            <div class="tab active" data-tab="password">密码登录</div>
            <div class="tab" data-tab="code">验证码登录</div>
            <div class="tab" data-tab="register">注册</div>
        </div>
        <div class="form-container">
            <div class="message" id="message"></div>

            <!-- 密码登录表单 -->
            <div class="form-item active" id="password-form">
                <div class="input-group">
                    <label>邮箱</label>
                    <input type="email" id="login-email" placeholder="请输入您的邮箱">
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="login-password" placeholder="请输入您的密码">
                </div>
                <button class="btn" id="login-password-btn">登录</button>
                <p class="tip">忘记密码？<a onclick="switchTab('reset')">点击找回</a></p>
                <p class="tip">还没有账号？<a onclick="switchTab('register')">立即注册</a></p>
            </div>

            <!-- 验证码登录表单 -->
            <div class="form-item" id="code-form">
                <div class="input-group">
                    <label>邮箱</label>
                    <input type="email" id="code-email" placeholder="请输入您的邮箱">
                </div>
                <div class="cf-box" id="code-cf"></div>
                <div class="input-group">
                    <label>验证码</label>
                    <div class="code-input">
                        <input type="text" id="code-code" placeholder="请输入6位验证码" maxlength="6">
                        <button id="send-code-btn">获取验证码</button>
                    </div>
                </div>
                <button class="btn" id="login-code-btn">登录</button>
                <p class="tip">还没有账号？<a onclick="switchTab('register')">立即注册</a></p>
            </div>

            <!-- 注册表单 -->
            <div class="form-item" id="register-form">
                <div class="input-group">
                    <label>邮箱</label>
                    <input type="email" id="register-email" placeholder="请输入您的邮箱">
                </div>
                <div class="cf-box" id="register-cf"></div>
                <div class="input-group">
                    <label>验证码</label>
                    <div class="code-input">
                        <input type="text" id="register-code" placeholder="请输入6位验证码" maxlength="6">
                        <button id="register-send-code-btn">获取验证码</button>
                    </div>
                </div>
                <div class="input-group">
                    <label>设置密码</label>
                    <input type="password" id="register-password" placeholder="请设置6位以上密码">
                </div>
                <button class="btn" id="register-btn">完成注册</button>
                <p class="tip">已有账号？<a onclick="switchTab('password')">立即登录</a></p>
            </div>

            <!-- 找回密码表单 -->
            <div class="form-item" id="reset-form">
                <div class="input-group">
                    <label>邮箱</label>
                    <input type="email" id="reset-email" placeholder="请输入您的邮箱">
                </div>
                <div class="cf-box" id="reset-cf"></div>
                <div class="input-group">
                    <label>验证码</label>
                    <div class="code-input">
                        <input type="text" id="reset-code" placeholder="请输入6位验证码" maxlength="6">
                        <button id="reset-send-code-btn">获取验证码</button>
                    </div>
                </div>
                <div class="input-group">
                    <label>新密码</label>
                    <input type="password" id="reset-password" placeholder="请设置6位以上新密码">
                </div>
                <button class="btn" id="reset-btn">重置密码</button>
                <p class="tip"><a onclick="switchTab('password')">返回登录</a></p>
            </div>
        </div>
    </div>

    <script>
        // 后端API地址（你的域名，已配置好）
        const API_BASE = 'https://liwz.top';
        const CF_SITE_KEY = '0x4AAAAAACyGeLsKIbpjbRer';
        let cfWidgets = {};

        // 页面加载完成
        window.onload = function() {
            // 已登录则跳转到生图页
            if (localStorage.getItem('aiimage_token')) {
                window.location.href = 'index.html';
                return;
            }

            // 加载Cloudflare人机验证
            turnstile.ready(function() {
                cfWidgets.code = turnstile.render('#code-cf', {
                    sitekey: CF_SITE_KEY,
                    theme: 'light',
                    size: 'normal'
                });
                cfWidgets.register = turnstile.render('#register-cf', {
                    sitekey: CF_SITE_KEY,
                    theme: 'light',
                    size: 'normal'
                });
                cfWidgets.reset = turnstile.render('#reset-cf', {
                    sitekey: CF_SITE_KEY,
                    theme: 'light',
                    size: 'normal'
                });
            });

            // 标签切换事件
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    switchTab(this.dataset.tab);
                });
            });
        };

        // 切换标签页
        function switchTab(tabName) {
            // 切换标签激活状态
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.dataset.tab === tabName) tab.classList.add('active');
            });

            // 切换表单显示
            document.querySelectorAll('.form-item').forEach(item => {
                item.classList.remove('active');
            });
            document.getElementById(`${tabName}-form`).classList.add('active');
            showMessage(''); // 清空提示
        }

        // 显示提示消息
        function showMessage(text, type = '') {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = 'message';
            if (type) msgEl.classList.add(type);
        }

        // 验证码倒计时
        function countdown(btnEl, seconds = 60) {
            let left = seconds;
            btnEl.disabled = true;
            const timer = setInterval(() => {
                left--;
                btnEl.textContent = `${left}秒后重发`;
                if (left <= 0) {
                    clearInterval(timer);
                    btnEl.disabled = false;
                    btnEl.textContent = '获取验证码';
                }
            }, 1000);
        }

        // 通用发送验证码函数
        async function sendCode(email, cfWidget, btnEl) {
            // 校验邮箱
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showMessage('请输入正确的邮箱地址', 'error');
                return;
            }
            // 校验人机验证
            const cfToken = turnstile.getResponse(cfWidget);
            if (!cfToken) {
                showMessage('请先完成人机验证', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/auth.php`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'send_code', email: email, cf_token: cfToken})
                });
                const data = await res.json();
                if (data.code === 200) {
                    showMessage(data.msg, 'success');
                    countdown(btnEl); // 开始倒计时
                    turnstile.reset(cfWidget); // 重置人机验证
                } else {
                    showMessage(data.msg, 'error');
                    turnstile.reset(cfWidget);
                }
            } catch (e) {
                showMessage('网络错误，请重试', 'error');
                turnstile.reset(cfWidget);
            }
        }

        // 验证码登录-发送验证码
        document.getElementById('send-code-btn').addEventListener('click', function() {
            const email = document.getElementById('code-email').value;
            sendCode(email, cfWidgets.code, this);
        });

        // 注册-发送验证码
        document.getElementById('register-send-code-btn').addEventListener('click', function() {
            const email = document.getElementById('register-email').value;
            sendCode(email, cfWidgets.register, this);
        });

        // 找回密码-发送验证码
        document.getElementById('reset-send-code-btn').addEventListener('click', function() {
            const email = document.getElementById('reset-email').value;
            sendCode(email, cfWidgets.reset, this);
        });

        // 密码登录
        document.getElementById('login-password-btn').addEventListener('click', async function() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            this.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/auth.php`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'login_password', email: email, password: password})
                });
                const data = await res.json();
                if (data.code === 200) {
                    showMessage(data.msg, 'success');
                    // 保存登录信息
                    localStorage.setItem('aiimage_token', data.data.token);
                    localStorage.setItem('aiimage_user', JSON.stringify(data.data));
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    showMessage(data.msg, 'error');
                    this.disabled = false;
                }
            } catch (e) {
                showMessage('网络错误，请重试', 'error');
                this.disabled = false;
            }
        });

        // 验证码登录
        document.getElementById('login-code-btn').addEventListener('click', async function() {
            const email = document.getElementById('code-email').value;
            const code = document.getElementById('code-code').value;
            this.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/auth.php`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'login_code', email: email, code: code})
                });
                const data = await res.json();
                if (data.code === 200) {
                    showMessage(data.msg, 'success');
                    localStorage.setItem('aiimage_token', data.data.token);
                    localStorage.setItem('aiimage_user', JSON.stringify(data.data));
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    showMessage(data.msg, 'error');
                    this.disabled = false;
                }
            } catch (e) {
                showMessage('网络错误，请重试', 'error');
                this.disabled = false;
            }
        });

        // 注册提交
        document.getElementById('register-btn').addEventListener('click', async function() {
            const email = document.getElementById('register-email').value;
            const code = document.getElementById('register-code').value;
            const password = document.getElementById('register-password').value;
            this.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/auth.php`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'register', email: email, code: code, password: password})
                });
                const data = await res.json();
                if (data.code === 200) {
                    showMessage(data.msg, 'success');
                    setTimeout(() => switchTab('password'), 1500);
                } else {
                    showMessage(data.msg, 'error');
                    this.disabled = false;
                }
            } catch (e) {
                showMessage('网络错误，请重试', 'error');
                this.disabled = false;
            }
        });

        // 重置密码提交
        document.getElementById('reset-btn').addEventListener('click', async function() {
            const email = document.getElementById('reset-email').value;
            const code = document.getElementById('reset-code').value;
            const new_password = document.getElementById('reset-password').value;
            this.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/auth.php`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'reset_password', email: email, code: code, new_password: new_password})
                });
                const data = await res.json();
                if (data.code === 200) {
                    showMessage(data.msg, 'success');
                    setTimeout(() => switchTab('password'), 1500);
                } else {
                    showMessage(data.msg, 'error');
                    this.disabled = false;
                }
            } catch (e) {
                showMessage('网络错误，请重试', 'error');
                this.disabled = false;
            }
        });
    </script>
</body>
</html>
