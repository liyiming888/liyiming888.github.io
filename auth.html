<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI生图平台 - 登录注册</title>
    <!-- 双重兼容：强制升级HTTP请求+允许混合内容，适配iPad端WebKit -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <!-- Cloudflare Turnstile 脚本加容错，避免iPad加载失败卡死 -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer onerror="window.turnstileLoadError=true"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .tab-header {
            display: flex;
            border-bottom: 1px solid #eee;
        }
        .tab-item {
            flex: 1;
            text-align: center;
            padding: 16px 0;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab-item.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 500;
        }
        .tab-content {
            padding: 30px 24px;
        }
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #333;
        }
        .form-input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }
        .input-row .form-input {
            flex: 1;
        }
        .code-btn {
            width: 120px;
            height: 48px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .code-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .submit-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }
        .submit-btn:active {
            transform: scale(0.98);
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .login-type-switch {
            text-align: right;
            margin-bottom: 20px;
        }
        .switch-link {
            color: #667eea;
            font-size: 14px;
            cursor: pointer;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .message.success {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
            display: block;
        }
        .message.error {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
            display: block;
        }
        .cf-turnstile {
            width: 100%;
            min-height: 65px;
        }
        .cf-turnstile iframe {
            width: 100% !important;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tab-header">
            <div class="tab-item active" data-tab="login">登录</div>
            <div class="tab-item" data-tab="register">注册</div>
            <div class="tab-item" data-tab="reset">找回密码</div>
        </div>
        <div class="tab-content">
            <div id="message" class="message"></div>
            <div class="tab-pane active" id="login">
                <div class="login-type-switch">
                    <span class="switch-link" id="loginTypeSwitch">使用验证码登录</span>
                </div>
                <div class="form-group">
                    <label class="form-label">邮箱</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="请输入您的邮箱">
                </div>
                <div class="form-group" id="passwordGroup">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="请输入您的密码">
                </div>
                <div class="form-group" id="codeGroup" style="display: none;">
                    <label class="form-label">验证码</label>
                    <div class="cf-turnstile" id="loginTurnstile"></div>
                    <div class="input-row">
                        <input type="text" class="form-input" id="loginCode" placeholder="请输入验证码">
                        <button class="code-btn" id="loginCodeBtn">获取验证码</button>
                    </div>
                </div>
                <button class="submit-btn" id="loginBtn">登录</button>
            </div>
            <div class="tab-pane" id="register">
                <div class="form-group">
                    <label class="form-label">邮箱</label>
                    <input type="email" class="form-input" id="registerEmail" placeholder="请输入您的邮箱">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="registerPassword" placeholder="请设置6位以上密码">
                </div>
                <div class="form-group">
                    <label class="form-label">验证码</label>
                    <div class="cf-turnstile" id="registerTurnstile"></div>
                    <div class="input-row">
                        <input type="text" class="form-input" id="registerCode" placeholder="请输入验证码">
                        <button class="code-btn" id="registerCodeBtn">获取验证码</button>
                    </div>
                </div>
                <button class="submit-btn" id="registerBtn">注册</button>
            </div>
            <div class="tab-pane" id="reset">
                <div class="form-group">
                    <label class="form-label">邮箱</label>
                    <input type="email" class="form-input" id="resetEmail" placeholder="请输入您的邮箱">
                </div>
                <div class="form-group">
                    <label class="form-label">新密码</label>
                    <input type="password" class="form-input" id="resetPassword" placeholder="请设置6位以上新密码">
                </div>
                <div class="form-group">
                    <label class="form-label">验证码</label>
                    <div class="cf-turnstile" id="resetTurnstile"></div>
                    <div class="input-row">
                        <input type="text" class="form-input" id="resetCode" placeholder="请输入验证码">
                        <button class="code-btn" id="resetCodeBtn">获取验证码</button>
                    </div>
                </div>
                <button class="submit-btn" id="resetBtn">重置密码</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://api.liwz.top:28850/';
        const TURNSTILE_SITEKEY = '0x4AAAAAACyGeLsKIbpjbRer';
        let isPasswordLogin = true;
        let pageInitDone = false;

        // 页面加载完成后初始化，加超时容错，避免iPad卡死
        window.onload = async () => {
            const token = localStorage.getItem('token');
            const email = localStorage.getItem('email');
            // 加10秒超时，避免一直加载
            const initTimeout = setTimeout(() => {
                if (!pageInitDone) {
                    localStorage.clear();
                    pageInitDone = true;
                }
            }, 10000);

            if (token && email) {
                try {
                    // 校验token有效性，加超时和容错
                    const res = await Promise.race([
                        fetch(API_BASE + 'auth.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'get_quota', token }),
                            mode: 'cors',
                            credentials: 'omit'
                        }),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('请求超时')), 8000))
                    ]);
                    const data = await res.json();
                    if (data.code === 0) {
                        clearTimeout(initTimeout);
                        pageInitDone = true;
                        window.location.href = 'index.html';
                    } else {
                        localStorage.clear();
                    }
                } catch (e) {
                    console.error('初始化请求失败', e);
                    localStorage.clear();
                }
            }
            clearTimeout(initTimeout);
            pageInitDone = true;
        };

        function showMessage(text, type = 'error') {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = `message ${type}`;
            setTimeout(() => msgEl.className = 'message', 3500);
        }

        function renderTurnstile(containerId, action) {
            if (window.turnstileLoadError) {
                showMessage('人机验证组件加载失败，请检查网络');
                return;
            }
            if (typeof turnstile === 'undefined') {
                setTimeout(() => renderTurnstile(containerId, action), 100);
                return;
            }
            try {
                turnstile.reset(`#${containerId}`);
                turnstile.render(`#${containerId}`, {
                    sitekey: TURNSTILE_SITEKEY,
                    theme: 'light',
                    action: action
                });
            } catch (e) {
                console.error('人机验证渲染失败', e);
            }
        }

        // 标签切换逻辑
        document.querySelectorAll('.tab-item').forEach(item => {
            item.addEventListener('click', () => {
                const tab = item.dataset.tab;
                document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                document.getElementById(tab).classList.add('active');
                showMessage('', '');

                if (tab === 'register') renderTurnstile('registerTurnstile', 'register_code');
                if (tab === 'reset') renderTurnstile('resetTurnstile', 'reset_code');
                if (tab === 'login' && !isPasswordLogin) renderTurnstile('loginTurnstile', 'login_code');
            });
        });

        // 登录方式切换
        document.getElementById('loginTypeSwitch').addEventListener('click', () => {
            isPasswordLogin = !isPasswordLogin;
            if (isPasswordLogin) {
                document.getElementById('passwordGroup').style.display = 'block';
                document.getElementById('codeGroup').style.display = 'none';
                document.getElementById('loginTypeSwitch').textContent = '使用验证码登录';
            } else {
                document.getElementById('passwordGroup').style.display = 'none';
                document.getElementById('codeGroup').style.display = 'block';
                document.getElementById('loginTypeSwitch').textContent = '使用密码登录';
                renderTurnstile('loginTurnstile', 'login_code');
            }
        });

        // 发送验证码核心逻辑，加超时容错
        async function sendCode(email, type, btnEl, turnstileId) {
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showMessage('请输入正确的邮箱地址');
                return;
            }
            if (typeof turnstile === 'undefined') {
                showMessage('人机验证组件加载中，请稍后重试');
                return;
            }
            const cfToken = turnstile.getResponse(`#${turnstileId}`);
            if (!cfToken) {
                showMessage('请先完成人机验证');
                return;
            }

            let countdown = 60;
            btnEl.disabled = true;
            btnEl.textContent = `${countdown}s后重发`;
            const timer = setInterval(() => {
                countdown--;
                btnEl.textContent = `${countdown}s后重发`;
                if (countdown <= 0) {
                    clearInterval(timer);
                    btnEl.disabled = false;
                    btnEl.textContent = '获取验证码';
                }
            }, 1000);

            try {
                const res = await Promise.race([
                    fetch(API_BASE + 'auth.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            action: 'send_code', 
                            email, 
                            type,
                            cf_turnstile_token: cfToken
                        }),
                        mode: 'cors',
                        credentials: 'omit'
                    }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('请求超时')), 10000))
                ]);
                const data = await res.json();
                if (data.code !== 0) {
                    clearInterval(timer);
                    btnEl.disabled = false;
                    btnEl.textContent = '获取验证码';
                    turnstile.reset(`#${turnstileId}`);
                    showMessage(data.msg);
                } else {
                    showMessage('验证码发送成功，请注意查收', 'success');
                    turnstile.reset(`#${turnstileId}`);
                }
            } catch (e) {
                clearInterval(timer);
                btnEl.disabled = false;
                btnEl.textContent = '获取验证码';
                turnstile.reset(`#${turnstileId}`);
                showMessage('网络错误，请检查网络后重试');
                console.error(e);
            }
        }

        // 按钮绑定事件
        document.getElementById('registerCodeBtn').addEventListener('click', () => {
            sendCode(document.getElementById('registerEmail').value, 'register', document.getElementById('registerCodeBtn'), 'registerTurnstile');
        });
        document.getElementById('loginCodeBtn').addEventListener('click', () => {
            sendCode(document.getElementById('loginEmail').value, 'login', document.getElementById('loginCodeBtn'), 'loginTurnstile');
        });
        document.getElementById('resetCodeBtn').addEventListener('click', () => {
            sendCode(document.getElementById('resetEmail').value, 'reset', document.getElementById('resetCodeBtn'), 'resetTurnstile');
        });

        // 注册逻辑
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const code = document.getElementById('registerCode').value;
            const btn = document.getElementById('registerBtn');

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showMessage('请输入正确的邮箱地址');
                return;
            }
            if (password.length < 6) {
                showMessage('密码长度不能少于6位');
                return;
            }
            if (!code) {
                showMessage('请输入验证码');
                return;
            }

            btn.disabled = true;
            btn.textContent = '注册中...';
            try {
                const res = await Promise.race([
                    fetch(API_BASE + 'auth.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'register', email, password, code }),
                        mode: 'cors',
                        credentials: 'omit'
                    }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('请求超时')), 10000))
                ]);
                const data = await res.json();
                if (data.code !== 0) {
                    showMessage(data.msg);
                } else {
                    showMessage('注册成功，请登录', 'success');
                    document.querySelector('[data-tab="login"]').click();
                    document.getElementById('loginEmail').value = email;
                }
            } catch (e) {
                showMessage('网络错误，请稍后重试');
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.textContent = '注册';
            }
        });

        // 登录逻辑
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const code = document.getElementById('loginCode').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showMessage('请输入正确的邮箱地址');
                return;
            }

            btn.disabled = true;
            btn.textContent = '登录中...';
            let body;
            if (isPasswordLogin) {
                if (!password) {
                    showMessage('请输入密码');
                    btn.disabled = false;
                    btn.textContent = '登录';
                    return;
                }
                body = JSON.stringify({ action: 'login_password', email, password });
            } else {
                if (!code) {
                    showMessage('请输入验证码');
                    btn.disabled = false;
                    btn.textContent = '验证码登录';
                    return;
                }
                body = JSON.stringify({ action: 'login_code', email, code });
            }

            try {
                const res = await Promise.race([
                    fetch(API_BASE + 'auth.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body,
                        mode: 'cors',
                        credentials: 'omit'
                    }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('请求超时')), 10000))
                ]);
                const data = await res.json();
                if (data.code !== 0) {
                    showMessage(data.msg);
                } else {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('email', data.data.email);
                    localStorage.setItem('quota', data.data.quota);
                    showMessage('登录成功，正在跳转...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 1000);
                }
            } catch (e) {
                showMessage('网络错误，请稍后重试');
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.textContent = isPasswordLogin ? '登录' : '验证码登录';
            }
        });

        // 重置密码逻辑
        document.getElementById('resetBtn').addEventListener('click', async () => {
            const email = document.getElementById('resetEmail').value;
            const newPassword = document.getElementById('resetPassword').value;
            const code = document.getElementById('resetCode').value;
            const btn = document.getElementById('resetBtn');

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showMessage('请输入正确的邮箱地址');
                return;
            }
            if (newPassword.length < 6) {
                showMessage('密码长度不能少于6位');
                return;
            }
            if (!code) {
                showMessage('请输入验证码');
                return;
            }

            btn.disabled = true;
            btn.textContent = '重置中...';
            try {
                const res = await Promise.race([
                    fetch(API_BASE + 'auth.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'reset_password', email, new_password: newPassword, code }),
                        mode: 'cors',
                        credentials: 'omit'
                    }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('请求超时')), 10000))
                ]);
                const data = await res.json();
                if (data.code !== 0) {
                    showMessage(data.msg);
                } else {
                    showMessage('密码重置成功，请登录', 'success');
                    document.querySelector('[data-tab="login"]').click();
                    document.getElementById('loginEmail').value = email;
                }
            } catch (e) {
                showMessage('网络错误，请稍后重试');
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.textContent = '重置密码';
            }
        });
    </script>
</body>
</html>
