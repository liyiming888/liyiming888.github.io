<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <!-- 强制HTTPS兼容，解决混合内容拦截，全浏览器适配 -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>AI生图平台 - 登录注册</title>
    <!-- Cloudflare Turnstile 人机验证脚本，完整容错 -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer onerror="window.turnstileLoadError=true"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .tab-header {
            display: flex;
            border-bottom: 1px solid #f0f0f0;
            background: #fafafa;
        }
        .tab-item {
            flex: 1;
            text-align: center;
            padding: 18px 0;
            cursor: pointer;
            font-size: 16px;
            color: #666666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
        }
        .tab-item.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 600;
            background: #ffffff;
        }
        .tab-content {
            padding: 35px 28px;
        }
        .tab-pane {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-pane.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: #333333;
            font-weight: 500;
        }
        .form-input {
            width: 100%;
            height: 50px;
            padding: 0 18px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background: #fafafa;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }
        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 12px;
        }
        .input-row .form-input {
            flex: 1;
        }
        .code-btn {
            width: 130px;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        .code-btn:hover:not(:disabled) {
            background: #5568d3;
        }
        .code-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .submit-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            user-select: none;
            -webkit-user-select: none;
        }
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .login-type-switch {
            text-align: right;
            margin-bottom: 22px;
        }
        .switch-link {
            color: #667eea;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
        }
        .switch-link:hover {
            color: #5568d3;
            text-decoration: underline;
        }
        .message {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
            word-break: break-all;
        }
        .message.success {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
            display: block;
        }
        .message.error {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
            display: block;
        }
        /* 人机验证容器完整样式 */
        .cf-turnstile {
            width: 100%;
            min-height: 65px;
            margin-bottom: 12px;
        }
        .cf-turnstile iframe {
            width: 100% !important;
            border-radius: 10px;
        }
        .loading-inline {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tab-header">
            <div class="tab-item active" data-tab="login">登录</div>
            <div class="tab-item" data-tab="register">注册</div>
            <div class="tab-item" data-tab="reset">找回密码</div>
        </div>
        <div class="tab-content">
            <div id="message" class="message"></div>
            <!-- 登录面板 - 完整功能 -->
            <div class="tab-pane active" id="login">
                <div class="login-type-switch">
                    <span class="switch-link" id="loginTypeSwitch">使用验证码登录</span>
                </div>
                <div class="form-group">
                    <label class="form-label">邮箱地址</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="请输入您的注册邮箱">
                </div>
                <div class="form-group" id="passwordGroup">
                    <label class="form-label">登录密码</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="请输入您的登录密码">
                </div>
                <div class="form-group" id="codeGroup" style="display: none;">
                    <label class="form-label">登录验证码</label>
                    <!-- 验证码登录人机验证容器 -->
                    <div class="cf-turnstile" id="loginTurnstile"></div>
                    <div class="input-row">
                        <input type="text" class="form-input" id="loginCode" placeholder="请输入邮箱收到的验证码">
                        <button class="code-btn" id="loginCodeBtn">获取验证码</button>
                    </div>
                </div>
                <button class="submit-btn" id="loginBtn">立即登录</button>
            </div>
            <!-- 注册面板 - 完整功能 -->
            <div class="tab-pane" id="register">
                <div class="form-group">
                    <label class="form-label">邮箱地址</label>
                    <input type="email" class="form-input" id="registerEmail" placeholder="请输入您的邮箱，用于注册账号">
                </div>
                <div class="form-group">
                    <label class="form-label">设置密码</label>
                    <input type="password" class="form-input" id="registerPassword" placeholder="请设置6位以上的登录密码">
                </div>
                <div class="form-group">
                    <label class="form-label">注册验证码</label>
                    <!-- 注册人机验证容器 -->
                    <div class="cf-turnstile" id="registerTurnstile"></div>
                    <div class="input-row">
                        <input type="text" class="form-input" id="registerCode" placeholder="请输入邮箱收到的注册验证码">
                        <button class="code-btn" id="registerCodeBtn">获取验证码</button>
                    </div>
                </div>
                <button class="submit-btn" id="registerBtn">立即注册</button>
            </div>
            <!-- 找回密码面板 - 完整功能 -->
            <div class="tab-pane" id="reset">
                <div class="form-group">
                    <label class="form-label">邮箱地址</label>
                    <input type="email" class="form-input" id="resetEmail" placeholder="请输入您的注册邮箱">
                </div>
                <div class="form-group">
                    <label class="form-label">设置新密码</label>
                    <input type="password" class="form-input" id="resetPassword" placeholder="请设置6位以上的新登录密码">
                </div>
                <div class="form-group">
                    <label class="form-label">重置验证码</label>
                    <!-- 找回密码人机验证容器 -->
                    <div class="cf-turnstile" id="resetTurnstile"></div>
                    <div class="input-row">
                        <input type="text" class="form-input" id="resetCode" placeholder="请输入邮箱收到的重置验证码">
                        <button class="code-btn" id="resetCodeBtn">获取验证码</button>
                    </div>
                </div>
                <button class="submit-btn" id="resetBtn">重置密码</button>
            </div>
        </div>
    </div>

    <script>
        // 🔴 最终HTTPS接口地址，无端口，全设备兼容
        const API_BASE = 'https://api.liwz.top/';
        const TURNSTILE_SITEKEY = '0x4AAAAAACyGeLsKIbpjbRer';
        let isPasswordLogin = true;
        let pageInitCompleted = false;

        // 页面加载完成初始化，完整token校验
        window.onload = async () => {
            const token = localStorage.getItem('token');
            const email = localStorage.getItem('email');
            // 超时容错，避免iPad页面卡死
            const initTimeout = setTimeout(() => {
                if (!pageInitCompleted) {
                    localStorage.clear();
                    pageInitCompleted = true;
                }
            }, 12000);

            if (token && email) {
                try {
                    // 校验token有效性，超时处理
                    const res = await Promise.race([
                        fetch(API_BASE + 'auth.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                            body: JSON.stringify({ action: 'get_quota', token }),
                            mode: 'cors',
                            credentials: 'omit'
                        }),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('请求超时')), 10000))
                    ]);
                    const data = await res.json();
                    if (data.code === 0) {
                        clearTimeout(initTimeout);
                        pageInitCompleted = true;
                        window.location.href = 'index.html';
                    } else {
                        localStorage.clear();
                    }
                } catch (e) {
                    console.error('初始化校验失败:', e);
                    localStorage.clear();
                }
            }
            clearTimeout(initTimeout);
            pageInitCompleted = true;
        };

        // 完整消息提示函数
        function showMessage(text, type = 'error') {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = `message ${type}`;
            setTimeout(() => {
                msgEl.className = 'message';
            }, 4000);
        }

        // 完整人机验证渲染函数，修复刷新消失bug
        function renderTurnstile(containerId, action) {
            if (window.turnstileLoadError) {
                showMessage('人机验证组件加载失败，请检查网络后刷新页面');
                return;
            }
            if (typeof turnstile === 'undefined') {
                setTimeout(() => renderTurnstile(containerId, action), 120);
                return;
            }
            try {
                turnstile.reset(`#${containerId}`);
                turnstile.render(`#${containerId}`, {
                    sitekey: TURNSTILE_SITEKEY,
                    theme: 'light',
                    action: action,
                    size: 'normal'
                });
            } catch (e) {
                console.error('人机验证渲染失败:', e);
            }
        }

        // 完整标签切换逻辑
        document.querySelectorAll('.tab-item').forEach(item => {
            item.addEventListener('click', () => {
                const tab = item.dataset.tab;
                // 切换标签激活状态
                document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                // 切换面板
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                document.getElementById(tab).classList.add('active');
                // 清空消息
                showMessage('', '');
                // 对应标签渲染人机验证
                if (tab === 'register') {
                    renderTurnstile('registerTurnstile', 'register_code');
                } else if (tab === 'reset') {
                    renderTurnstile('resetTurnstile', 'reset_code');
                } else if (tab === 'login' && !isPasswordLogin) {
                    renderTurnstile('loginTurnstile', 'login_code');
                }
            });
        });

        // 完整登录方式切换逻辑
        document.getElementById('loginTypeSwitch').addEventListener('click', () => {
            isPasswordLogin = !isPasswordLogin;
            if (isPasswordLogin) {
                // 切换到密码登录
                document.getElementById('passwordGroup').style.display = 'block';
                document.getElementById('codeGroup').style.display = 'none';
                document.getElementById('loginTypeSwitch').textContent = '使用验证码登录';
            } else {
                // 切换到验证码登录
                document.getElementById('passwordGroup').style.display = 'none';
                document.getElementById('codeGroup').style.display = 'block';
                document.getElementById('loginTypeSwitch').textContent = '使用密码登录';
                renderTurnstile('loginTurnstile', 'login_code');
            }
            showMessage('', '');
        });

        // 完整发送验证码核心逻辑，全功能保留
        async function sendCode(email, type, btnEl, turnstileId) {
            // 邮箱格式校验
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showMessage('请输入正确的邮箱地址');
                return;
            }
            // 人机验证加载校验
            if (typeof turnstile === 'undefined') {
                showMessage('人机验证组件正在加载中，请稍后重试');
                return;
            }
            // 人机验证token校验
            const cfToken = turnstile.getResponse(`#${turnstileId}`);
            if (!cfToken) {
                showMessage('请先完成人机验证，再获取验证码');
                return;
            }

            // 完整倒计时逻辑
            let countdown = 60;
            btnEl.disabled = true;
            btnEl.textContent = `${countdown}s后重发`;
            const timer = setInterval(() => {
                countdown--;
                btnEl.textContent = `${countdown}s后重发`;
                if (countdown <= 0) {
                    clearInterval(timer);
                    btnEl.disabled = false;
                    btnEl.textContent = '获取验证码';
                }
            }, 1000);

            try {
                // 完整请求，超时容错
                const res = await Promise.race([
                    fetch(API_BASE + 'auth.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ 
                            action: 'send_code', 
                            email: email, 
                            type: type,
                            cf_turnstile_token: cfToken
                        }),
                        mode: 'cors',
                        credentials: 'omit'
                    }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('请求超时')), 12000))
                ]);
                const data = await res.json();
                if (data.code !== 0) {
                    // 失败重置
                    clearInterval(timer);
                    btnEl.disabled = false;
                    btnEl.textContent = '获取验证码';
                    turnstile.reset(`#${turnstileId}`);
                    showMessage(data.msg);
                } else {
                    showMessage('验证码发送成功，请注意查收邮箱', 'success');
                    turnstile.reset(`#${turnstileId}`);
                }
            } catch (e) {
                // 异常重置
                clearInterval(timer);
                btnEl.disabled = false;
                btnEl.textContent = '获取验证码';
                turnstile.reset(`#${turnstileId}`);
                showMessage('网络错误，请检查网络后重试');
                console.error('验证码发送失败:', e);
            }
        }

        // 三个验证码按钮完整绑定
        document.getElementById('registerCodeBtn').addEventListener('click', () => {
            const email = document.getElementById('registerEmail').value;
            sendCode(email, 'register', document.getElementById('registerCodeBtn'), 'registerTurnstile');
        });
        document.getElementById('loginCodeBtn').addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value;
            sendCode(email, 'login', document.getElementById('loginCodeBtn'), 'loginTurnstile');
        });
        document.getElementById('resetCodeBtn').addEventListener('click', () => {
            const email = document.getElementById('resetEmail').value;
            sendCode(email, 'reset', document.getElementById('resetCodeBtn'), 'resetTurnstile');
        });

        // 完整注册逻辑，全功能保留
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value.trim();
            const code = document.getElementById('registerCode').value.trim();
            const btn = document.getElementById('registerBtn');

            // 完整表单校验
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showMessage('请输入正确的邮箱地址');
                return;
            }
            if (password.length < 6) {
                showMessage('密码长度不能少于6位');
                return;
            }
            if (!code) {
                showMessage('请输入注册验证码');
                return;
            }

            // 按钮加载状态
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-inline"></span> 注册中...';

            try {
                // 完整请求，超时容错
                const res = await Promise.race([
                    fetch(API_BASE + 'auth.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ action: 'register', email: email, password: password, code: code }),
                        mode: 'cors',
                        credentials: 'omit'
                    }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('请求超时')), 15000))
                ]);
                const data = await res.json();
                if (data.code !== 0) {
                    showMessage(data.msg);
                } else {
                    showMessage('注册成功！即将跳转到登录页面', 'success');
                    // 自动切换到登录页，填充邮箱
                    setTimeout(() => {
                        document.querySelector('[data-tab="login"]').click();
                        document.getElementById('loginEmail').value = email;
                    }, 1500);
                }
            } catch (e) {
                showMessage('网络错误，请检查网络后重试');
                console.error('注册失败:', e);
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btn.innerHTML = '立即注册';
            }
        });

        // 完整登录逻辑，全功能保留
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const code = document.getElementById('loginCode').value.trim();
            const btn = document.getElementById('loginBtn');

            // 邮箱格式校验
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showMessage('请输入正确的邮箱地址');
                return;
            }

            // 按钮加载状态
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-inline"></span> 登录中...';

            let requestBody;
            if (isPasswordLogin) {
                // 密码登录
                if (!password) {
                    showMessage('请输入登录密码');
                    btn.disabled = false;
                    btn.innerHTML = '立即登录';
                    return;
                }
                requestBody = JSON.stringify({ action: 'login_password', email: email, password: password });
            } else {
                // 验证码登录
                if (!code) {
                    showMessage('请输入登录验证码');
                    btn.disabled = false;
                    btn.innerHTML = '立即登录';
                    return;
                }
                requestBody = JSON.stringify({ action: 'login_code', email: email, code: code });
            }

            try {
                // 完整请求，超时容错
                const res = await Promise.race([
                    fetch(API_BASE + 'auth.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: requestBody,
                        mode: 'cors',
                        credentials: 'omit'
                    }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('请求超时')), 15000))
                ]);
                const data = await res.json();
                if (data.code !== 0) {
                    showMessage(data.msg);
                } else {
                    // 登录成功，存储用户信息
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('email', data.data.email);
                    localStorage.setItem('quota', data.data.quota);
                    showMessage('登录成功！正在跳转到主页', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1200);
                }
            } catch (e) {
                showMessage('网络错误，请检查网络后重试');
                console.error('登录失败:', e);
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btn.innerHTML = '立即登录';
            }
        });

        // 完整重置密码逻辑，全功能保留
        document.getElementById('resetBtn').addEventListener('click', async () => {
            const email = document.getElementById('resetEmail').value.trim();
            const newPassword = document.getElementById('resetPassword').value.trim();
            const code = document.getElementById('resetCode').value.trim();
            const btn = document.getElementById('resetBtn');

            // 完整表单校验
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showMessage('请输入正确的邮箱地址');
                return;
            }
            if (newPassword.length < 6) {
                showMessage('新密码长度不能少于6位');
                return;
            }
            if (!code) {
                showMessage('请输入重置验证码');
                return;
            }

            // 按钮加载状态
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-inline"></span> 重置中...';

            try {
                // 完整请求，超时容错
                const res = await Promise.race([
                    fetch(API_BASE + 'auth.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ action: 'reset_password', email: email, new_password: newPassword, code: code }),
                        mode: 'cors',
                        credentials: 'omit'
                    }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('请求超时')), 15000))
                ]);
                const data = await res.json();
                if (data.code !== 0) {
                    showMessage(data.msg);
                } else {
                    showMessage('密码重置成功！即将跳转到登录页面', 'success');
                    // 自动切换到登录页，填充邮箱
                    setTimeout(() => {
                        document.querySelector('[data-tab="login"]').click();
                        document.getElementById('loginEmail').value = email;
                    }, 1500);
                }
            } catch (e) {
                showMessage('网络错误，请检查网络后重试');
                console.error('密码重置失败:', e);
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btn.innerHTML = '重置密码';
            }
        });

        // 回车触发登录/注册/重置
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const activeTab = document.querySelector('.tab-pane.active').id;
                if (activeTab === 'login') document.getElementById('loginBtn').click();
                if (activeTab === 'register') document.getElementById('registerBtn').click();
                if (activeTab === 'reset') document.getElementById('resetBtn').click();
            }
        });
    </script>
</body>
</html>
