<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邮箱验证码发送</title>
  <!-- 引入最新版Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.3"></script>
  <!-- 引入Cloudflare Turnstile人机验证脚本 -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .card-shadow {
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-4 font-sans">
  <div class="w-full max-w-md bg-white rounded-2xl card-shadow p-8">
    <div class="text-center mb-8">
      <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-gray-800 mb-2">邮箱验证码</h1>
      <p class="text-gray-500 text-sm">请输入您的邮箱地址，完成验证后获取验证码</p>
    </div>

    <form id="codeForm" class="space-y-6">
      <!-- 邮箱输入框 -->
      <div class="space-y-2">
        <label for="email" class="block text-sm font-medium text-gray-700">邮箱地址</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="请输入您的邮箱"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all duration-200"
        />
      </div>

      <!-- Cloudflare Turnstile 人机验证 -->
      <div class="cf-turnstile" data-sitekey="0x4AAAAAACyGeLsKIbpjbRer" data-theme="light"></div>

      <!-- 发送按钮 -->
      <button
        type="submit"
        id="sendBtn"
        disabled
        class="w-full bg-primary text-white font-medium py-3 rounded-lg hover:bg-primary/90 active:bg-primary/80 transition-all duration-200 disabled:bg-gray-300 disabled:cursor-not-allowed"
      >
        发送验证码
      </button>

      <!-- 提示信息 -->
      <div id="message" class="text-center text-sm hidden"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('codeForm');
    const sendBtn = document.getElementById('sendBtn');
    const messageBox = document.getElementById('message');
    const emailInput = document.getElementById('email');

    // 人机验证完成后启用按钮
    window.onloadTurnstileCallback = function () {
      turnstile.ready(function () {
        turnstile.on('success', () => {
          sendBtn.disabled = false;
        });
        turnstile.on('error', () => {
          sendBtn.disabled = true;
          showMessage('人机验证失败，请刷新重试', 'red');
        });
        turnstile.on('expired', () => {
          sendBtn.disabled = true;
          showMessage('人机验证已过期，请重新验证', 'orange');
        });
      });
    };

    // 表单提交处理
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      const turnstileToken = turnstile.getResponse();

      // 前置校验
      if (!email) {
        showMessage('请输入邮箱地址', 'orange');
        return;
      }
      if (!turnstileToken) {
        showMessage('请先完成人机验证', 'orange');
        return;
      }

      // 按钮加载状态
      sendBtn.disabled = true;
      sendBtn.innerText = '发送中...';
      clearMessage();

      try {
        // 替换为你的腾讯云服务器公网IP+端口
        const response = await fetch('http://101.32.215.93:3000/send-code', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            email: email,
            turnstileToken: turnstileToken
          })
        });

        const result = await response.json();

        if (response.ok) {
          showMessage('验证码已发送，请注意查收邮箱（垃圾箱也请查看）', 'green');
          emailInput.value = '';
          turnstile.reset();
        } else {
          showMessage(result.message || '发送失败，请重试', 'red');
        }
      } catch (error) {
        console.error('请求错误:', error);
        showMessage('网络错误，请检查服务器是否正常运行', 'red');
      } finally {
        sendBtn.innerText = '发送验证码';
        sendBtn.disabled = false;
      }
    });

    // 提示信息工具函数
    function showMessage(text, color) {
      messageBox.innerText = text;
      messageBox.className = 'text-center text-sm block';
      if (color === 'red') messageBox.classList.add('text-red-500');
      if (color === 'green') messageBox.classList.add('text-green-500');
      if (color === 'orange') messageBox.classList.add('text-orange-500');
    }

    function clearMessage() {
      messageBox.innerText = '';
      messageBox.className = 'text-center text-sm hidden';
    }
  </script>
</body>
</html>
