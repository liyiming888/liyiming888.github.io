<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邮箱验证码 | 简洁版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
    }

    .email-input-wrapper {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s ease;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input.error {
      border-color: #ff4757;
    }

    .code-input-wrapper input {
      text-align: center;
      letter-spacing: 8px;
      font-size: 24px;
      font-weight: 600;
    }

    button {
      padding: 14px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: #ccc;
    }

    .verify-btn {
      width: 100%;
      margin-top: 10px;
      padding: 16px;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .message.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      display: block;
    }

    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .step {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e0e0e0;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
    }

    .step.active {
      background: #667eea;
      color: white;
    }

    .step.completed {
      background: #00b894;
      color: white;
    }

    .step-line {
      width: 60px;
      height: 2px;
      background: #e0e0e0;
      margin: 0 8px;
    }

    .step-line.completed {
      background: #00b894;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📧 邮箱验证</h2>
    <p class="subtitle">请输入您的邮箱，获取验证码</p>

    <!-- 步骤指示器 -->
    <div class="step-indicator">
      <span class="step" id="step1">1</span>
      <span class="step-line" id="line"></span>
      <span class="step" id="step2">2</span>
    </div>

    <!-- 第一步：输入邮箱 -->
    <div id="emailStep">
      <div class="input-group">
        <label>邮箱地址</label>
        <div class="email-input-wrapper">
          <input type="email" id="emailInput" placeholder="example@domain.com" autocomplete="off">
          <button id="sendCodeBtn" onclick="sendVerificationCode()">发送验证码</button>
        </div>
      </div>
    </div>

    <!-- 第二步：输入验证码 -->
    <div id="codeStep" class="hidden">
      <div class="input-group">
        <label>验证码</label>
        <div class="code-input-wrapper">
          <input type="text" id="codeInput" placeholder="6位验证码" maxlength="6" autocomplete="off">
        </div>
        <p style="font-size: 13px; color: #666; margin-top: 8px;">
          验证码已发送至 <strong id="sentEmailDisplay"></strong><br>
          <span id="countdownText">60秒后可重新发送</span>
        </p>
      </div>
      <button class="verify-btn" id="verifyBtn" onclick="verifyCode()">验证</button>
      <button class="verify-btn" id="resendBtn" onclick="resendCode()" style="background: #6c757d; margin-top: 10px;" disabled>重新发送</button>
    </div>

    <!-- 消息提示 -->
    <div id="message" class="message"></div>
  </div>

  <script>
    // ==================== 请修改为您的服务器 IP ====================
    const API_BASE_URL = 'http://YOUR_SERVER_IP:3000/api';
    // 例如：const API_BASE_URL = 'http://123.456.78.90:3000/api';
    
    let currentEmail = '';
    let countdown = 60;
    let countdownTimer = null;

    function showMessage(text, type = 'info') {
      const msgEl = document.getElementById('message');
      msgEl.textContent = text;
      msgEl.className = `message ${type}`;
    }

    function hideMessage() {
      document.getElementById('message').className = 'message';
    }

    function switchToCodeStep(email) {
      document.getElementById('emailStep').classList.add('hidden');
      document.getElementById('codeStep').classList.remove('hidden');
      document.getElementById('step1').classList.add('completed');
      document.getElementById('step2').classList.add('active');
      document.getElementById('line').classList.add('completed');
      document.getElementById('sentEmailDisplay').textContent = email;
    }

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function startCountdown() {
      const resendBtn = document.getElementById('resendBtn');
      const countdownText = document.getElementById('countdownText');
      
      countdown = 60;
      resendBtn.disabled = true;
      
      if (countdownTimer) clearInterval(countdownTimer);
      
      countdownTimer = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          clearInterval(countdownTimer);
          countdownTimer = null;
          resendBtn.disabled = false;
          countdownText.textContent = '可以重新发送验证码';
        } else {
          countdownText.textContent = `${countdown}秒后可重新发送`;
        }
      }, 1000);
    }

    async function sendVerificationCode() {
      const emailInput = document.getElementById('emailInput');
      const email = emailInput.value.trim();
      
      emailInput.classList.remove('error');
      hideMessage();
      
      if (!email) {
        showMessage('请输入邮箱地址', 'error');
        emailInput.classList.add('error');
        return;
      }
      
      if (!validateEmail(email)) {
        showMessage('请输入正确的邮箱格式', 'error');
        emailInput.classList.add('error');
        return;
      }
      
      currentEmail = email;
      
      const sendBtn = document.getElementById('sendCodeBtn');
      sendBtn.disabled = true;
      sendBtn.textContent = '发送中...';
      showMessage('正在发送验证码...', 'info');
      
      try {
        const response = await fetch(`${API_BASE_URL}/send-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showMessage('验证码已发送，请查收邮件', 'success');
          switchToCodeStep(currentEmail);
          startCountdown();
        } else {
          showMessage(data.msg || '发送失败，请稍后重试', 'error');
        }
      } catch (error) {
        showMessage('网络错误，请检查服务器连接', 'error');
        console.error('Error:', error);
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = '发送验证码';
      }
    }

    async function resendCode() {
      if (countdown > 0) return;
      
      const resendBtn = document.getElementById('resendBtn');
      resendBtn.disabled = true;
      resendBtn.textContent = '发送中...';
      showMessage('正在重新发送验证码...', 'info');
      
      try {
        const response = await fetch(`${API_BASE_URL}/send-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showMessage('验证码已重新发送', 'success');
          startCountdown();
          document.getElementById('codeInput').value = '';
        } else {
          showMessage(data.msg || '发送失败', 'error');
          resendBtn.disabled = false;
        }
      } catch (error) {
        showMessage('网络错误', 'error');
        resendBtn.disabled = false;
      } finally {
        resendBtn.textContent = '重新发送';
      }
    }

    async function verifyCode() {
      const codeInput = document.getElementById('codeInput');
      const code = codeInput.value.trim();
      
      codeInput.classList.remove('error');
      hideMessage();
      
      if (!code || code.length !== 6) {
        showMessage('请输入6位验证码', 'error');
        codeInput.classList.add('error');
        return;
      }
      
      const verifyBtn = document.getElementById('verifyBtn');
      verifyBtn.disabled = true;
      verifyBtn.textContent = '验证中...';
      
      try {
        const response = await fetch(`${API_BASE_URL}/verify-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, code: code })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showMessage('✅ 验证成功！', 'success');
          document.getElementById('step2').classList.add('completed');
        } else {
          showMessage(data.msg || '验证码错误或已过期', 'error');
          codeInput.classList.add('error');
        }
      } catch (error) {
        showMessage('验证失败，请重试', 'error');
      } finally {
        verifyBtn.disabled = false;
        verifyBtn.textContent = '验证';
      }
    }

    // 回车事件
    document.getElementById('emailInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendVerificationCode();
    });
    document.getElementById('codeInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') verifyCode();
    });
  </script>
</body>
</html>
