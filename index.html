<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Cloudflare 人机验证 · 纯前端版</title>
<!-- 必须引入 Cloudflare 验证脚本 -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  body {
    padding: 40px;
    font-family: system-ui, sans-serif;
  }
  .form-box {
    max-width: 360px;
    margin: 0 auto;
  }
  input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    box-sizing: border-box;
  }
  button {
    padding: 10px 20px;
    background: #0070f3;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
</style>
</head>

<body>
<div class="form-box">
  <h3>登录验证</h3>
  <form id="login-form">
    <input type="text" placeholder="用户名" required>
    <input type="password" placeholder="密码" required>

    <!-- Cloudflare 人机验证容器 -->
    <div id="cf-turnstile"></div>
    <br>

    <button type="submit">提交登录</button>
  </form>
</div>

<script>
// 1. 渲染验证组件
turnstile.render('#cf-turnstile', {
  // 这是 Cloudflare 官方公开测试 KEY，可直接用于开发
  // 上线时换成你自己的 sitekey 即可
  sitekey: '0x4AAAAAACxKvjF618FHOono',
  language: 'zh-CN',
  theme: 'auto',
  callback: function(token) {
    console.log('✅ 验证成功，token：', token);
  }
});

// 2. 提交前校验
const form = document.getElementById('login-form');
form.addEventListener('submit', function(e) {
  const token = turnstile.getResponse();

  // 前端拦截：没验证就不让提交
  if (!token) {
    e.preventDefault();
    alert('请完成人机验证');
    return;
  }

  // 验证通过，允许提交
  alert('验证通过，表单已提交');
});
</script>
</body>
</html>
