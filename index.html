<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI生图工具</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4">
<div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow">
  <h2 class="text-center text-xl font-bold mb-5">GRS AI 生图</h2>

  <div class="mb-4">
    <label class="block font-medium mb-1">提示词</label>
    <textarea id="prompt" class="w-full border border-slate-300 rounded-lg p-3 h-28" placeholder="例如：一只可爱的小猫，治愈系，高清"></textarea>
  </div>

  <div class="mb-5">
    <div class="flex justify-between items-center mb-1">
      <label class="font-medium">图片比例</label>
      <span id="ratioTxt" class="text-blue-600">1:1</span>
    </div>
    <input type="range" id="ratio" min="1" max="4" value="1" class="w-full">
  </div>

  <button id="generate" class="w-full bg-blue-600 text-white py-3 rounded-lg">生成图片</button>

  <div class="mt-5 p-5 border-dashed border rounded-lg text-center min-h-[300px] flex flex-col items-center justify-center">
    <img id="result" class="max-h-[300px] rounded-lg hidden">
    <p id="tip" class="text-slate-500">图片将显示在这里</p>
  </div>
</div>

<script>
const ratioMap = {1:"1:1", 2:"4:3", 3:"16:9", 4:"9:16"};
const ratio = document.getElementById('ratio');
const ratioTxt = document.getElementById('ratioTxt');

ratio.addEventListener('input', ()=>{
  ratioTxt.textContent = ratioMap[ratio.value];
});

document.getElementById('generate').onclick = async ()=>{
  const prompt = document.getElementById('prompt').value.trim();
  if(!prompt) return alert('请输入提示词');

  const btn = document.getElementById('generate');
  const tip = document.getElementById('tip');
  const img = document.getElementById('result');

  btn.disabled = true;
  btn.textContent = '生成中...';
  tip.textContent = '请求接口中...';
  img.classList.add('hidden');

  try {
    const res = await fetch("proxy.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: prompt,
        size: ratioMap[ratio.value]
      })
    });
    const data = await res.json();
    const imgUrl = data?.data?.url || data?.url || data?.image_url;
    if(imgUrl){
      img.src = imgUrl;
      img.classList.remove('hidden');
      tip.textContent = '生成成功';
    }else{
      tip.textContent = '失败：' + (data?.msg || '无图片地址');
    }
  } catch(e){
    tip.textContent = '请求失败';
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = '生成图片';
  }
};
</script>
</body>
</html>
