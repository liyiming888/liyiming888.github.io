<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI生图平台</title>
    <!-- 同样加这句，解决跨浏览器拦截 -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
        body{background:#f6f8fb;padding:20px;min-height:100vh}
        .header{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:16px;margin-bottom:20px}
        .card{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px}
        textarea{width:100%;height:140px;border-radius:8px;border:1px solid #ddd;padding:12px;font-size:16px}
        .row{display:flex;gap:12px;margin-bottom:16px}
        .row>div{flex:1}
        select{width:100%;height:48px;border-radius:8px;border:1px solid #ddd;padding:0 12px}
        button{width:100%;height:50px;border:none;border-radius:8px;background:#6366f1;color:#fff;font-size:16px}
        .loading{text-align:center;padding:40px}
        .result img{max-width:100%;border-radius:8px;margin:10px 0}
        .btn-group{display:flex;gap:12px}
        .message{padding:12px;border-radius:8px;margin-bottom:16px}
        .error{background:#fee2e2;color:#b91c1c}
        .success{background:#dcfce7;color:#166534}
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div id="userEmail"></div>
            <div>剩余额度：<span id="quotaNum"></span></div>
        </div>
        <button id="logoutBtn" style="width:auto;padding:0 16px">退出登录</button>
    </div>

    <div class="card">
        <div class="message" id="message"></div>
        <textarea id="prompt" placeholder="输入画面描述..."></textarea>
        <div class="row">
            <div>
                <label>模型</label>
                <select id="model">
                    <option>gpt-image-1.5</option>
                    <option>sora-image</option>
                    <option>nano-banana-pro</option>
                </select>
            </div>
            <div>
                <label>比例</label>
                <select id="ratio">
                    <option>1:1</option><option>9:16</option><option>16:9</option>
                </select>
            </div>
        </div>
        <button id="generateBtn">立即生成</button>
    </div>

    <div class="loading" id="loading" style="display:none">生成中，请稍候...</div>
    <div class="card result" id="result" style="display:none">
        <img id="img">
        <div class="btn-group">
            <button id="download">保存图片</button>
            <button id="copy">复制链接</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://api.liwz.top:28850/';
        window.onload = () => {
            const t = localStorage.getItem('token');
            const e = localStorage.getItem('email');
            if(!t||!e)location.href='auth.html';
            document.getElementById('userEmail').textContent = e;
        };
        function msg(t,e='error'){
            const m=document.getElementById('message');
            m.textContent=t;m.className='message '+e;
            setTimeout(()=>m.className='message',3000);
        }
        document.getElementById('logoutBtn').onclick=()=>{localStorage.clear();location.href='auth.html'};
    </script>
</body>
</html>
