<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邮箱验证码验证</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/sitekey/0x4AAAAAACyGeLsKIbpjbRer"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      padding: 40px;
      width: 100%;
      max-width: 450px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #165DFF;
      box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.1);
    }

    .captcha-group {
      display: flex;
      gap: 12px;
    }

    .captcha-group input {
      flex: 1;
    }

    .send-btn {
      padding: 14px 20px;
      background: #f0f2f5;
      border: none;
      border-radius: 8px;
      color: #666;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s;
    }

    .send-btn:enabled:hover {
      background: #e5e7eb;
    }

    .send-btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .send-btn.active {
      background: #165DFF;
      color: white;
    }

    .send-btn.active:hover {
      background: #0d47a1;
    }

    .turnstile-container {
      margin: 24px 0;
      display: flex;
      justify-content: center;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #165DFF;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background: #0d47a1;
    }

    .submit-btn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .success {
      background: #d1fae5;
      color: #065f46;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>邮箱验证码验证</h1>
    
    <div class="form-group">
      <label for="email">邮箱地址</label>
      <input type="email" id="email" placeholder="请输入您的邮箱" required>
    </div>

    <div class="form-group">
      <label for="captcha">验证码</label>
      <div class="captcha-group">
        <input type="text" id="captcha" placeholder="请输入6位验证码" maxlength="6" required>
        <button id="sendBtn" class="send-btn" disabled>发送验证码</button>
      </div>
    </div>

    <div class="turnstile-container">
      <div 
        class="cf-turnstile" 
        data-sitekey="0x4AAAAAACyGeLsKIbpjbRer"
        data-callback="onTurnstileSuccess"
        data-expired-callback="onTurnstileExpired"
      ></div>
    </div>

    <button id="submitBtn" class="submit-btn" disabled>验证</button>

    <div id="message" class="message"></div>
  </div>

  <script>
    // 后端API地址 - 替换为你的腾讯云服务器公网IP
    const API_BASE = 'http://101.32.215.93:3000/api';

    const emailInput = document.getElementById('email');
    const captchaInput = document.getElementById('captcha');
    const sendBtn = document.getElementById('sendBtn');
    const submitBtn = document.getElementById('submitBtn');
    const message = document.getElementById('message');

    let turnstileToken = null;

    // Cloudflare Turnstile 回调
    window.onTurnstileSuccess = function(token) {
      turnstileToken = token;
      sendBtn.disabled = false;
      sendBtn.classList.add('active');
    };

    window.onTurnstileExpired = function() {
      turnstileToken = null;
      sendBtn.disabled = true;
      sendBtn.classList.remove('active');
    };

    // 显示消息
    function showMessage(text, isSuccess) {
      message.textContent = text;
      message.className = `message ${isSuccess ? 'success' : 'error'}`;
      message.style.display = 'block';
      
      setTimeout(() => {
        message.style.display = 'none';
      }, 5000);
    }

    // 倒计时
    function startCountdown(seconds) {
      let remaining = seconds;
      sendBtn.disabled = true;
      sendBtn.textContent = `${remaining}秒后重发`;

      const timer = setInterval(() => {
        remaining--;
        sendBtn.textContent = `${remaining}秒后重发`;

        if (remaining <= 0) {
          clearInterval(timer);
          sendBtn.textContent = '发送验证码';
          sendBtn.disabled = false;
        }
      }, 1000);
    }

    // 发送验证码
    sendBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      
      if (!email) {
        showMessage('请输入邮箱地址', false);
        return;
      }

      if (!turnstileToken) {
        showMessage('请先完成人机验证', false);
        return;
      }

      try {
        sendBtn.disabled = true;
        sendBtn.textContent = '发送中...';

        const response = await fetch(`${API_BASE}/send-captcha`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email,
            turnstileToken
          })
        });

        const data = await response.json();

        if (data.success) {
          showMessage('验证码发送成功', true);
          startCountdown(60);
          submitBtn.disabled = false;
        } else {
          showMessage(data.message, false);
          sendBtn.disabled = false;
          sendBtn.textContent = '发送验证码';
          // 重置Turnstile
          turnstile.reset();
        }
      } catch (error) {
        console.error('发送失败:', error);
        showMessage('网络错误，请稍后再试', false);
        sendBtn.disabled = false;
        sendBtn.textContent = '发送验证码';
      }
    });

    // 验证验证码
    submitBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const captcha = captchaInput.value.trim();

      if (!email || !captcha) {
        showMessage('请填写完整信息', false);
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = '验证中...';

        const response = await fetch(`${API_BASE}/verify-captcha`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, captcha })
        });

        const data = await response.json();

        if (data.success) {
          showMessage('验证成功！', true);
          // 这里可以添加验证成功后的逻辑，比如跳转到登录成功页面
          setTimeout(() => {
            alert('验证成功，即将进入系统');
          }, 1500);
        } else {
          showMessage(data.message, false);
        }
      } catch (error) {
        console.error('验证失败:', error);
        showMessage('网络错误，请稍后再试', false);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '验证';
      }
    });
  </script>
</body>
</html>
