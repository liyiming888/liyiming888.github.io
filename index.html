<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI生图</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4">
<div class="max-w-xl mx-auto bg-white p-5 rounded-xl shadow">
  <h2 class="text-center font-bold mb-4">AI 生图工具</h2>

  <div class="mb-3">
    <label class="block mb-1">提示词</label>
    <textarea id="prompt" class="w-full border p-3 rounded h-24" placeholder="输入画面描述"></textarea>
  </div>

  <div class="mb-3">
    <label class="block mb-1">比例</label>
    <input type="range" id="ratio" min="1" max="4" value="1">
    <span id="ratioTxt">1:1</span>
  </div>

  <button id="generate" class="w-full bg-blue-500 text-white py-2 rounded">生成图片</button>

  <div class="mt-4 p-4 border-dashed border text-center min-h-[260px]">
    <img id="result" class="max-h-[250px] hidden">
    <p id="tip">等待生成</p>
  </div>
</div>

<script>
const ratioMap = {1:"1:1", 2:"4:3", 3:"16:9", 4:"9:16"};
const ratio = document.getElementById('ratio');
const ratioTxt = document.getElementById('ratioTxt');

ratio.addEventListener('input', ()=>{
  ratioTxt.textContent = ratioMap[ratio.value];
});

document.getElementById('generate').onclick = async ()=>{
  const prompt = document.getElementById('prompt').value.trim();
  if(!prompt) return alert('请输入提示词');

  const btn = document.getElementById('generate');
  const tip = document.getElementById('tip');
  const img = document.getElementById('result');

  btn.disabled = true;
  btn.textContent = '生成中...';
  tip.textContent = '请求中...';
  img.classList.add('hidden');

  try {
    const res = await fetch("proxy.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: prompt,
        size: ratioMap[ratio.value]
      })
    });
    const data = await res.json();
    const imgUrl = data?.url;
    if(imgUrl){
      img.src = imgUrl;
      img.classList.remove('hidden');
      tip.textContent = '生成成功';
    }else{
      tip.textContent = '失败：' + (data.msg || '无图片地址');
    }
  } catch(e){
    tip.textContent = '请求失败';
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = '生成图片';
  }
};
</script>
</body>
</html>
