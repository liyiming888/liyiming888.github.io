<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>邮箱验证 · 优雅发送</title>
    <!-- Cloudflare Turnstile 脚本 -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f9fafc 0%, #edf2f7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            padding: 1.5rem;
        }

        .card {
            max-width: 460px;
            width: 100%;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 32px;
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.12), 0 8px 18px rgba(0,0,0,0.05);
            padding: 2.5rem 2rem;
            transition: all 0.2s ease;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #1e293b, #2d3b5e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.35rem;
        }

        .subhead {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 2rem;
            font-weight: 400;
            border-left: 3px solid #3b82f6;
            padding-left: 14px;
        }

        .input-group {
            margin-bottom: 1.8rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e293b;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            color: #0f172a;
            font-weight: 450;
        }

        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
        }

        .input-field::placeholder {
            color: #94a3b8;
            font-weight: 300;
        }

        .turnstile-container {
            margin: 28px 0 24px;
            display: flex;
            justify-content: center;
        }

        .btn {
            width: 100%;
            background: #0f172a;
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: 550;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 18px -6px rgba(15,23,42,0.2);
            letter-spacing: 0.3px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-top: 6px;
        }

        .btn:hover {
            background: #1e293b;
            transform: translateY(-1px);
            box-shadow: 0 14px 22px -8px rgba(15,23,42,0.25);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 6px 12px -4px rgba(0,0,0,0.1);
        }

        .btn:disabled {
            background: #94a3b8;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .message {
            margin-top: 22px;
            min-height: 44px;
            font-size: 0.95rem;
            color: #334155;
            text-align: center;
            border-radius: 30px;
            padding: 8px 12px;
            transition: 0.2s;
        }

        .message.success {
            background: #e6f7e6;
            color: #0c6b4b;
        }

        .message.error {
            background: #fff0f0;
            color: #bc1c1c;
        }

        .footnote {
            text-align: center;
            margin-top: 28px;
            color: #64748b;
            font-size: 0.8rem;
            opacity: 0.75;
        }

        .cf-turnstile {
            min-height: 65px;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .card { padding: 2rem 1.5rem; }
            h1 { font-size: 1.9rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📬 验证码</h1>
        <div class="subhead">安全 · 极速 · 简约</div>

        <div class="input-group">
            <label>📧 电子邮箱</label>
            <input type="email" id="emailInput" class="input-field" placeholder="your@email.com" autocomplete="email" required>
        </div>

        <!-- Cloudflare Turnstile 人机验证 -->
        <div class="turnstile-container">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAACyGeLsKIbpjbRer" data-theme="light"></div>
        </div>

        <button id="sendBtn" class="btn">发送验证码</button>

        <div id="messageBox" class="message"></div>
        <div class="footnote">由 Cloudflare 提供安全防护</div>
    </div>

    <script>
        (function() {
            const emailInput = document.getElementById('emailInput');
            const sendBtn = document.getElementById('sendBtn');
            const messageBox = document.getElementById('messageBox');

            // 显示消息
            function showMessage(text, isSuccess = true) {
                messageBox.textContent = text;
                messageBox.className = 'message ' + (isSuccess ? 'success' : 'error');
            }

            // 清除消息
            function clearMessage() {
                messageBox.textContent = '';
                messageBox.className = 'message';
            }

            // 获取 Turnstile 验证 token
            function getTurnstileToken() {
                return new Promise((resolve, reject) => {
                    // 尝试从全局 turnstile 对象获取
                    const turnstileResponse = turnstile?.getResponse?.();
                    if (turnstileResponse) {
                        resolve(turnstileResponse);
                        return;
                    }
                    
                    // 如果未加载完成或未验证，等待一小段时间尝试一次
                    setTimeout(() => {
                        const token = turnstile?.getResponse?.();
                        if (token) {
                            resolve(token);
                        } else {
                            reject(new Error('请先完成人机验证'));
                        }
                    }, 100);
                });
            }

            // 发送验证码请求
            async function handleSend() {
                const email = emailInput.value.trim();
                
                // 前端基础校验
                if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    showMessage('请输入有效的邮箱地址', false);
                    return;
                }

                clearMessage();
                sendBtn.disabled = true;
                sendBtn.textContent = '⏳ 验证中...';

                try {
                    // 获取 Turnstile token
                    const token = await getTurnstileToken();
                    
                    // 更新按钮状态
                    sendBtn.textContent = '📤 发送中...';
                    
                    const response = await fetch('/api/send-code', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, turnstileToken: token })
                    });

                    const result = await response.json();
                    
                    if (result.success) {
                        showMessage('✅ 验证码已发送，请查收邮箱', true);
                        // 重置 Turnstile (以便再次发送时重新验证)
                        if (typeof turnstile !== 'undefined') {
                            turnstile.reset();
                        }
                    } else {
                        showMessage(`❌ ${result.message || '发送失败'}`, false);
                        // 失败时也重置验证，防止 token 重复使用
                        if (typeof turnstile !== 'undefined') {
                            turnstile.reset();
                        }
                    }
                } catch (error) {
                    console.error('请求出错:', error);
                    let errorMsg = '网络或服务异常，请稍后重试';
                    if (error.message.includes('人机验证')) {
                        errorMsg = error.message;
                    }
                    showMessage(`⚠️ ${errorMsg}`, false);
                    if (typeof turnstile !== 'undefined') {
                        turnstile.reset();
                    }
                } finally {
                    sendBtn.disabled = false;
                    sendBtn.textContent = '发送验证码';
                }
            }

            // 绑定点击事件
            sendBtn.addEventListener('click', handleSend);

            // 按回车键也可触发 (但需要焦点不在按钮上)
            emailInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendBtn.click();
                }
            });

            // 如果 Turnstile 加载较慢，确保用户完成验证后才能获取 token —— 已经在 getTurnstileToken 中处理
        })();
    </script>
</body>
</html>
