<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>AI生图平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #f8f9fa;
            padding: 20px;
            padding-bottom: 50px;
        }
        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }
        .header {
            background: #ffffff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .user-info {
            flex: 1;
            min-width: 220px;
        }
        .user-email {
            font-size: 16px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 6px;
            word-break: break-all;
        }
        .quota-info {
            font-size: 15px;
            color: #4361ee;
            font-weight: 500;
        }
        .logout-btn {
            padding: 12px 20px;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            background: #ffffff;
            color: #6c757d;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 48px;
            flex-shrink: 0;
            user-select: none;
        }
        .logout-btn:hover {
            border-color: #fa5252;
            color: #fa5252;
            background: #fff5f5;
        }
        .logout-btn:active {
            transform: scale(0.98);
        }
        .form-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 25px 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-label {
            display: block;
            margin-bottom: 10px;
            font-size: 15px;
            color: #495057;
            font-weight: 600;
        }
        .textarea-wrapper {
            position: relative;
        }
        .form-textarea {
            width: 100%;
            min-height: 160px;
            padding: 15px 18px;
            padding-bottom: 45px;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            font-size: 16px;
            line-height: 1.6;
            resize: none;
            background: #fafafa;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }
        .form-textarea:focus {
            outline: none;
            border-color: #4361ee;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }
        .clear-btn {
            position: absolute;
            right: 15px;
            bottom: 15px;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #f1f3f5;
            color: #6c757d;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }
        .clear-btn:hover {
            background: #e9ecef;
            color: #495057;
        }
        .clear-btn:active {
            transform: scale(0.96);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-select {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            font-size: 15px;
            background: #fafafa;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='none' stroke='%236c757d' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
            padding-right: 40px;
        }
        .form-select:focus {
            outline: none;
            border-color: #4361ee;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }
        .generate-btn {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 5px;
            user-select: none;
        }
        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(67, 97, 238, 0.4);
        }
        .generate-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
            display: none;
            word-break: break-all;
        }
        .message.success {
            background: #f0fff4;
            color: #2f9e44;
            border: 1px solid #b2f2bb;
            display: block;
        }
        .message.error {
            background: #fff5f5;
            color: #fa5252;
            border: 1px solid #ffc9c9;
            display: block;
        }
        .loading {
            background: #ffffff;
            border-radius: 14px;
            padding: 50px 20px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
            display: none;
        }
        .loading.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f1f3f5;
            border-top: 4px solid #4361ee;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading-text {
            font-size: 16px;
            color: #495057;
            line-height: 1.6;
        }
        .result-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 25px 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .result-card.show {
            display: block;
        }
        .result-title {
            font-size: 17px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 20px;
        }
        .image-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
        }
        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .action-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }
        .action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .action-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .download-btn {
            background: #2f9e44;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(47, 158, 68, 0.3);
        }
        .download-btn:hover:not(:disabled) {
            background: #2b8a3e;
            box-shadow: 0 6px 18px rgba(47, 158, 68, 0.4);
        }
        .copy-btn {
            background: #4361ee;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
        }
        .copy-btn:hover:not(:disabled) {
            background: #3b5bdb;
            box-shadow: 0 6px 18px rgba(67, 97, 238, 0.4);
        }
        .loading-inline {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        .tips {
            margin-top: 20px;
            font-size: 14px;
            color: #868e96;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="message" class="message"></div>

        <div class="header">
            <div class="user-info">
                <div class="user-email" id="userEmail"></div>
                <div class="quota-info">剩余免费生成额度：<span id="quotaNum">0</span> 张</div>
            </div>
            <button class="logout-btn" id="logoutBtn">退出登录</button>
        </div>

        <div class="form-card">
            <div class="form-group">
                <label class="form-label">图片描述提示词</label>
                <div class="textarea-wrapper">
                    <textarea class="form-textarea" id="prompt" placeholder="请详细描述你想要生成的图片内容，越详细生成效果越好。例如：一只可爱的柯基犬在春天的草地上奔跑，阳光明媚，高清写实风格，8K画质，细节丰富"></textarea>
                    <button class="clear-btn" id="clearBtn">清空内容</button>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">生成模型</label>
                    <select class="form-select" id="model">
                        <option value="gpt-image-1.5">GPT Image 1.5</option>
                        <option value="sora-image">Sora Image</option>
                        <option value="nano-banana-pro">Nano Banana Pro</option>
                        <option value="nano-banana-2">Nano Banana 2</option>
                        <option value="nano-banana-fast">Nano Banana Fast</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">图片比例</label>
                    <select class="form-select" id="ratio">
                        <option value="1:1">1:1 方形</option>
                        <option value="9:16">9:16 竖屏</option>
                        <option value="16:9">16:9 横屏</option>
                        <option value="3:4">3:4 竖版</option>
                        <option value="4:3">4:3 标准</option>
                    </select>
                </div>
            </div>
            <button class="generate-btn" id="generateBtn">立即生成图片</button>
        </div>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在生成图片，请稍候...<br>请勿关闭或切走页面，生成时间约10-30秒</div>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-title">✅ 图片生成成功</div>
            <div class="image-wrapper">
                <img id="resultImage" alt="AI生成的图片" crossorigin="anonymous">
            </div>
            <div class="btn-group">
                <button class="action-btn download-btn" id="downloadBtn">保存图片</button>
                <button class="action-btn copy-btn" id="copyBtn">复制图片链接</button>
            </div>
        </div>

        <div class="tips">
            提示：提示词描述越详细，生成的图片效果越好<br>免费额度用完后将无法继续生成图片
        </div>
    </div>

    <script>
        const API_BASE = 'https://api.liwz.top/';
        let currentImageUrl = '';

        window.onload = async () => {
            const token = localStorage.getItem('token');
            const email = localStorage.getItem('email');
            if (!token || !email) {
                window.location.href = 'auth.html';
                return;
            }
            document.getElementById('userEmail').textContent = email;
            await refreshQuota();
        };

        function showMessage(text, type = 'error') {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = `message ${type}`;
            setTimeout(() => {
                msgEl.className = 'message';
            }, 4000);
        }

        async function refreshQuota() {
            const token = localStorage.getItem('token');
            try {
                const res = await Promise.race([
                    fetch(API_BASE + 'auth.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'get_quota', token }),
                        mode: 'cors',
                        credentials: 'omit'
                    }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 10000))
                ]);
                const data = await res.json();
                if (data.code !== 0) {
                    showMessage(data.msg);
                    setTimeout(() => {
                        localStorage.clear();
                        window.location.href = 'auth.html';
                    }, 1500);
                } else {
                    const q = data.data.quota;
                    document.getElementById('quotaNum').textContent = q;
                    localStorage.setItem('quota', q);
                }
            } catch (e) {
                showMessage('网络异常，无法获取额度');
                document.getElementById('quotaNum').textContent = localStorage.getItem('quota') || 0;
            }
        }

        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('prompt').value = '';
            document.getElementById('prompt').focus();
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = 'auth.html';
        });

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const token = localStorage.getItem('token');
            const prompt = document.getElementById('prompt').value.trim();
            const model = document.getElementById('model').value;
            const ratio = document.getElementById('ratio').value;
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('resultCard');

            if (!prompt) {
                showMessage('请输入图片描述提示词');
                return;
            }
            if (parseInt(localStorage.getItem('quota') || 0) <= 0) {
                showMessage('免费额度已用完');
                return;
            }

            result.classList.remove('show');
            loading.classList.add('show');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-inline"></span> 生成中...';
            currentImageUrl = '';

            try {
                const res = await Promise.race([
                    fetch(API_BASE + 'generate.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, prompt, model, ratio }),
                        mode: 'cors',
                        credentials: 'omit'
                    }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 60000))
                ]);
                const data = await res.json();
                if (data.code !== 0) {
                    showMessage(data.msg);
                } else {
                    currentImageUrl = data.data.image_url;
                    document.getElementById('resultImage').src = currentImageUrl;
                    result.classList.add('show');
                    document.getElementById('quotaNum').textContent = data.data.remaining_quota;
                    localStorage.setItem('quota', data.data.remaining_quota);
                    showMessage('图片生成成功！', 'success');
                    result.scrollIntoView({ behavior: 'smooth' });
                }
            } catch (e) {
                showMessage('网络异常，生成失败');
            } finally {
                loading.classList.remove('show');
                btn.disabled = false;
                btn.innerHTML = '立即生成图片';
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', async () => {
            if (!currentImageUrl) {
                showMessage('暂无图片可保存');
                return;
            }
            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-inline"></span> 保存中...';
            try {
                const res = await fetch(currentImageUrl);
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'AI生图_' + Date.now() + '.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showMessage('保存成功', 'success');
            } catch (e) {
                window.open(currentImageUrl, '_blank');
                showMessage('已打开，长按保存', 'success');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '保存图片';
            }
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            if (!currentImageUrl) {
                showMessage('暂无链接可复制');
                return;
            }
            navigator.clipboard.writeText(currentImageUrl).then(() => {
                showMessage('链接已复制', 'success');
            }).catch(() => {
                const input = document.createElement('input');
                input.value = currentImageUrl;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showMessage('链接已复制', 'success');
            });
        });
    </script>
</body>
</html>
