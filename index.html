<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>网课空间站 | 可切换服务器</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #eef2f5 100%);
            min-height: 100vh;
            color: #1a2c3e;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.6);
        }
        .landing-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }
        .entry-card {
            flex: 1;
            min-width: 280px;
            max-width: 420px;
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
        }
        .entry-icon { font-size: 3rem; margin-bottom: 1rem; }
        .entry-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #1f6e8c, #2c3e66);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .entry-desc { color: #5b6e8c; margin-bottom: 1.5rem; }
        .join-input-group {
            display: flex;
            gap: 0.5rem;
            background: #fff;
            border-radius: 60px;
            padding: 0.2rem;
            border: 1px solid #e2e9f2;
        }
        .join-input-group input {
            flex: 1;
            border: none;
            padding: 0.7rem 1rem;
            border-radius: 60px;
            outline: none;
            font-family: monospace;
        }
        .join-btn {
            background: #1f6e8c;
            color: white;
            border: none;
            padding: 0 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            cursor: pointer;
        }
        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .room-key-badge {
            background: #1e2f3f;
            color: #eef4ff;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .leave-btn {
            background: #e74c3c20;
            border: 1px solid #e74c3c40;
            color: #c0392b;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            cursor: pointer;
        }
        .mode-switch {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 0.2rem;
            display: inline-flex;
            margin: 0.5rem 0;
        }
        .mode-option {
            padding: 0.3rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .mode-option.active {
            background: #1f6e8c;
            color: white;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        .video-card {
            background: #11181c;
            border-radius: 1.2rem;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .video-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.6);
            padding: 2px 8px;
            border-radius: 20px;
            color: white;
            font-size: 0.7rem;
        }
        .control-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px);
            padding: 0.6rem 1rem;
            border-radius: 60px;
            margin: 0.8rem 0;
        }
        .ctrl-btn {
            background: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .ctrl-btn.danger { color: #c0392b; background: #fff0f0; }
        .ctrl-btn.primary { background: #1f6e8c; color: white; }
        .whiteboard-container {
            background: white;
            border-radius: 1.2rem;
            overflow: hidden;
            margin: 1rem 0;
            display: none;
        }
        .whiteboard-container.active { display: block; }
        .whiteboard-toolbar {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            flex-wrap: wrap;
        }
        canvas {
            width: 100%;
            height: auto;
            background: white;
            cursor: crosshair;
            touch-action: none;
        }
        .members-panel {
            background: rgba(255,255,255,0.7);
            border-radius: 1.2rem;
            padding: 0.8rem;
            margin-top: 1rem;
        }
        .member-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .member-chip {
            background: white;
            border-radius: 40px;
            padding: 0.2rem 0.8rem;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            color: white;
            backdrop-filter: blur(8px);
            gap: 1rem;
            text-align: center;
            padding: 2rem;
        }
        .loading-overlay button, .loading-overlay select {
            background: #fff;
            color: #1a2c3e;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .loading-overlay select {
            background: #fff;
            cursor: pointer;
        }
        .error-message {
            color: #c0392b;
            background: #fff0f0;
            padding: 1rem;
            border-radius: 1rem;
            margin: 1rem;
            text-align: center;
        }
        .server-selector {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
<div class="container" id="appRoot"></div>

<script>
    // 可选信令服务器列表
    const PEER_SERVERS = [
        { host: '0.peerjs.com', port: 443, path: '/', secure: true },
        { host: '1.peerjs.com', port: 443, path: '/', secure: true },
        { host: '2.peerjs.com', port: 443, path: '/', secure: true }
    ];
    let currentServerIndex = 0; // 默认使用第一个

    let currentView = 'landing';
    let myRole = null;
    let myPeer = null;
    let localStream = null;
    let screenStream = null;
    let connections = new Map();
    let dataConnections = new Map();
    let roomKey = null;
    let members = new Map();
    let myName = null;
    let currentFacing = 'user';
    let currentMode = 'video';
    let canvas = null, ctx = null, isDrawing = false, lastX = 0, lastY = 0, drawColor = '#000000', drawSize = 3;

    function generateRoomKey() {
        return Math.floor(100000000000 + Math.random() * 900000000000).toString();
    }
    function randomName(role) {
        const names = ['星野同学', '林川', '明理', '知远', '云深', '南絮', '听风', '静澜'];
        const name = names[Math.floor(Math.random() * names.length)] + Math.floor(Math.random() * 100);
        return role === 'host' ? name + '(主持人)' : name + '(学生)';
    }

    let loadingTimeout = null;
    let currentRetryCallback = null;
    function showLoading(msg, retryCallback = null) {
        if (loadingTimeout) clearTimeout(loadingTimeout);
        let el = document.querySelector('.loading-overlay');
        if (!el) {
            el = document.createElement('div');
            el.className = 'loading-overlay';
            document.body.appendChild(el);
        }
        currentRetryCallback = retryCallback;
        let serverSelectHtml = '';
        if (myRole === 'host' || myRole === 'student') {
            serverSelectHtml = `
                <div class="server-selector">
                    <span>当前服务器: ${PEER_SERVERS[currentServerIndex].host}</span>
                    <button id="switchServerBtn">切换服务器</button>
                </div>
            `;
        }
        el.innerHTML = `
            <div>${msg}</div>
            ${serverSelectHtml}
            ${retryCallback ? '<button id="loadingRetryBtn">重试</button>' : ''}
        `;
        const switchBtn = document.getElementById('switchServerBtn');
        if (switchBtn) switchBtn.onclick = () => {
            currentServerIndex = (currentServerIndex + 1) % PEER_SERVERS.length;
            showLoading(`已切换到 ${PEER_SERVERS[currentServerIndex].host}<br>重新尝试连接...`, currentRetryCallback);
            if (currentRetryCallback) setTimeout(() => currentRetryCallback(), 500);
        };
        const retryBtn = document.getElementById('loadingRetryBtn');
        if (retryBtn) retryBtn.onclick = () => { hideLoading(); if (retryCallback) retryCallback(); };
        el.style.display = 'flex';
        loadingTimeout = setTimeout(() => {
            if (el.style.display === 'flex') {
                hideLoading();
                alert('操作超时，请重试或切换服务器');
            }
        }, 30000);
    }
    function hideLoading() {
        const el = document.querySelector('.loading-overlay');
        if (el) el.style.display = 'none';
        if (loadingTimeout) clearTimeout(loadingTimeout);
    }

    function createPeerWithTimeout(peerId = null, timeout = 20000) {
        return new Promise((resolve, reject) => {
            const config = PEER_SERVERS[currentServerIndex];
            const peer = peerId ? new Peer(peerId, config) : new Peer(config);
            let resolved = false;
            const timer = setTimeout(() => {
                if (!resolved) {
                    peer.destroy();
                    reject(new Error('连接超时，可能是网络问题或服务器不可达'));
                }
            }, timeout);
            peer.on('open', () => {
                if (!resolved) {
                    resolved = true;
                    clearTimeout(timer);
                    resolve(peer);
                }
            });
            peer.on('error', (err) => {
                if (!resolved) {
                    resolved = true;
                    clearTimeout(timer);
                    reject(err);
                }
            });
        });
    }

    async function getMediaStream() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            return stream;
        } catch (err) {
            if (err.name === 'NotAllowedError') throw new Error('请允许摄像头和麦克风权限');
            if (err.name === 'NotFoundError') throw new Error('未检测到摄像头或麦克风设备');
            throw new Error('获取媒体设备失败: ' + err.message);
        }
    }

    // 画板相关（省略细节，但保留完整功能）
    function initWhiteboard() {
        const container = document.getElementById('whiteboardContainer');
        if (!container) return;
        canvas = document.getElementById('sharedCanvas');
        if (!canvas) return;
        ctx = canvas.getContext('2d');
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = Math.min(400, rect.height * 0.6);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let x = (clientX - rect.left) * scaleX;
            let y = (clientY - rect.top) * scaleY;
            x = Math.min(Math.max(0, x), canvas.width);
            y = Math.min(Math.max(0, y), canvas.height);
            return { x, y };
        }
        function startDraw(e) {
            e.preventDefault();
            isDrawing = true;
            const { x, y } = getCanvasCoords(e);
            lastX = x;
            lastY = y;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y);
            ctx.strokeStyle = drawColor;
            ctx.lineWidth = drawSize;
            ctx.stroke();
            sendDrawEvent({ x, y, prevX: x, prevY: y, color: drawColor, size: drawSize, action: 'dot' });
        }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const { x, y } = getCanvasCoords(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = drawColor;
            ctx.lineWidth = drawSize;
            ctx.stroke();
            sendDrawEvent({ x, y, prevX: lastX, prevY: lastY, color: drawColor, size: drawSize, action: 'line' });
            lastX = x;
            lastY = y;
        }
        function endDraw() { isDrawing = false; }
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('touchstart', startDraw);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', endDraw);
    }
    function sendDrawEvent(data) {
        for (let [peerId, dc] of dataConnections) {
            if (dc.open) dc.send({ type: 'draw', data });
        }
    }
    function applyDrawEvent(data) {
        if (!ctx) return;
        const { x, y, prevX, prevY, color, size, action } = data;
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.beginPath();
        if (action === 'dot') {
            ctx.moveTo(x, y);
            ctx.lineTo(x + 0.5, y + 0.5);
        } else {
            ctx.moveTo(prevX, prevY);
            ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();
    }
    function clearCanvas() {
        if (ctx) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let [peerId, dc] of dataConnections) {
                if (dc.open) dc.send({ type: 'clearCanvas' });
            }
        }
    }

    function setMode(mode) {
        if (mode === currentMode) return;
        currentMode = mode;
        const videoModeBtn = document.getElementById('modeVideo');
        const boardModeBtn = document.getElementById('modeBoard');
        if (videoModeBtn && boardModeBtn) {
            if (mode === 'video') {
                videoModeBtn.classList.add('active');
                boardModeBtn.classList.remove('active');
            } else {
                videoModeBtn.classList.remove('active');
                boardModeBtn.classList.add('active');
            }
        }
        const videoGrid = document.getElementById('videoGrid');
        const whiteboard = document.getElementById('whiteboardContainer');
        if (videoGrid && whiteboard) {
            if (mode === 'video') {
                videoGrid.style.display = 'grid';
                whiteboard.classList.remove('active');
            } else {
                videoGrid.style.display = 'none';
                whiteboard.classList.add('active');
                if (!ctx) initWhiteboard();
            }
        }
        for (let [peerId, dc] of dataConnections) {
            if (dc.open) dc.send({ type: 'modeChange', mode });
        }
    }

    async function onCreateCourse() {
        showLoading('步骤1: 请求摄像头/麦克风权限...', () => onCreateCourse());
        try {
            localStream = await getMediaStream();
            showLoading('步骤2: 连接信令服务器...<br>当前服务器: ' + PEER_SERVERS[currentServerIndex].host, () => onCreateCourse());
            const key = generateRoomKey();
            roomKey = key;
            myRole = 'host';
            myName = randomName('host');
            myPeer = await createPeerWithTimeout(key);
            hideLoading();
            enterRoomPage();
            myPeer.on('connection', (conn) => {
                dataConnections.set(conn.peer, conn);
                conn.on('data', (data) => {
                    if (data.type === 'draw') applyDrawEvent(data.data);
                    else if (data.type === 'clearCanvas' && ctx) ctx.clearRect(0,0,canvas.width,canvas.height);
                    else if (data.type === 'join') {
                        members.set(conn.peer, { name: data.name, muted: false });
                        updateMemberListUI();
                    }
                });
            });
            myPeer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    addVideoToGrid(call.peer, remoteStream, members.get(call.peer)?.name || '学生');
                });
                connections.set(call.peer, call);
                if (!members.has(call.peer)) members.set(call.peer, { name: '学生', muted: false });
                updateMemberListUI();
            });
        } catch (err) {
            hideLoading();
            let errorMsg = err.message;
            if (errorMsg.includes('超时')) errorMsg = '连接服务器超时，请切换其他服务器或检查网络';
            else if (errorMsg.includes('权限')) errorMsg = '请允许摄像头和麦克风权限后刷新重试';
            alert('创建课程失败: ' + errorMsg);
            renderLanding();
        }
    }

    async function onJoinCourse() {
        const key = document.getElementById('courseKeyInput')?.value.trim();
        if (!key || !/^\d{12}$/.test(key)) { alert('请输入12位数字密钥'); return; }
        showLoading('步骤1: 请求摄像头/麦克风权限...', () => onJoinCourse());
        try {
            localStream = await getMediaStream();
            showLoading('步骤2: 连接信令服务器...<br>当前服务器: ' + PEER_SERVERS[currentServerIndex].host, () => onJoinCourse());
            roomKey = key;
            myRole = 'student';
            myName = randomName('student');
            myPeer = await createPeerWithTimeout();
            const dc = myPeer.connect(roomKey);
            dc.on('open', () => {
                dataConnections.set('host', dc);
                dc.send({ type: 'join', name: myName });
            });
            dc.on('data', (data) => {
                if (data.type === 'draw') applyDrawEvent(data.data);
                else if (data.type === 'clearCanvas' && ctx) ctx.clearRect(0,0,canvas.width,canvas.height);
                else if (data.type === 'modeChange') setMode(data.mode);
            });
            const call = myPeer.call(roomKey, localStream);
            call.on('stream', (remoteStream) => {
                addVideoToGrid('host', remoteStream, '主持人');
            });
            connections.set('host', call);
            hideLoading();
            enterRoomPage();
        } catch (err) {
            hideLoading();
            let errorMsg = err.message;
            if (errorMsg.includes('超时')) errorMsg = '连接服务器超时，请切换其他服务器或检查网络';
            else if (errorMsg.includes('权限')) errorMsg = '请允许摄像头和麦克风权限后刷新重试';
            alert('加入课程失败: ' + errorMsg);
            renderLanding();
        }
    }

    function enterRoomPage() {
        currentView = 'room';
        renderRoomUI();
        addVideoToGrid('self', localStream, myName);
        setupRoomControls();
        initWhiteboard();
        setMode('video');
    }

    function renderRoomUI() {
        const hostBadge = myRole === 'host' ? '<span style="background:#e6b42220; padding:4px 8px; border-radius:30px;">👑 主持人</span>' : '';
        document.getElementById('appRoot').innerHTML = `
            <div>
                <div class="room-header">
                    <div>
                        <h2>📡 网课空间站</h2>
                        <div style="font-size:0.85rem;">课程密钥：<span class="room-key-badge">${roomKey}</span> ${hostBadge}</div>
                    </div>
                    <button class="leave-btn" id="leaveRoomBtn">🚪 离开课堂</button>
                </div>
                <div class="mode-switch" id="modeSwitch">
                    <div class="mode-option active" id="modeVideo">🎥 视频模式</div>
                    <div class="mode-option" id="modeBoard">✏️ 画板模式</div>
                </div>
                <div class="video-grid" id="videoGrid"></div>
                <div class="whiteboard-container" id="whiteboardContainer">
                    <div class="whiteboard-toolbar">
                        <input type="color" id="drawColor" value="#000000" style="width:32px;height:32px;border:none;border-radius:50%;">
                        <input type="range" id="drawSize" min="1" max="20" value="3" style="width:80px;">
                        <button class="ctrl-btn" id="clearBoardBtn">🧽 清空</button>
                    </div>
                    <canvas id="sharedCanvas" style="width:100%; height:auto; min-height:200px; background:#fff;"></canvas>
                </div>
                <div class="control-bar" id="controlBar"></div>
                <div class="members-panel">
                    <div class="member-list" id="memberList"></div>
                </div>
            </div>
        `;
        document.getElementById('leaveRoomBtn')?.addEventListener('click', leaveRoom);
        document.getElementById('modeVideo')?.addEventListener('click', () => setMode('video'));
        document.getElementById('modeBoard')?.addEventListener('click', () => setMode('whiteboard'));
        const colorPicker = document.getElementById('drawColor');
        const sizeSlider = document.getElementById('drawSize');
        const clearBtn = document.getElementById('clearBoardBtn');
        if (colorPicker) colorPicker.addEventListener('input', (e) => { drawColor = e.target.value; });
        if (sizeSlider) sizeSlider.addEventListener('input', (e) => { drawSize = parseInt(e.target.value); });
        if (clearBtn) clearBtn.addEventListener('click', () => clearCanvas());
    }

    function setupRoomControls() {
        const controlDiv = document.getElementById('controlBar');
        if (myRole === 'host') {
            controlDiv.innerHTML = `
                <button class="ctrl-btn" id="toggleMicBtn">🎤 麦克风开</button>
                <button class="ctrl-btn" id="toggleCamBtn">📷 摄像头开</button>
                <button class="ctrl-btn" id="switchCamBtn">🔄 切换摄像头</button>
                <button class="ctrl-btn primary" id="shareScreenBtn">🖥️ 共享屏幕</button>
                <button class="ctrl-btn danger" id="muteAllBtn">🔇 全体静音</button>
            `;
            document.getElementById('toggleMicBtn')?.addEventListener('click', toggleMic);
            document.getElementById('toggleCamBtn')?.addEventListener('click', toggleCam);
            document.getElementById('switchCamBtn')?.addEventListener('click', switchCamera);
            document.getElementById('shareScreenBtn')?.addEventListener('click', startScreenShare);
            document.getElementById('muteAllBtn')?.addEventListener('click', muteAllStudents);
        } else {
            controlDiv.innerHTML = `
                <button class="ctrl-btn" id="toggleMicBtn">🎤 麦克风开</button>
                <button class="ctrl-btn" id="toggleCamBtn">📷 摄像头开</button>
                <button class="ctrl-btn" id="switchCamBtn">🔄 切换摄像头</button>
            `;
            document.getElementById('toggleMicBtn')?.addEventListener('click', toggleMic);
            document.getElementById('toggleCamBtn')?.addEventListener('click', toggleCam);
            document.getElementById('switchCamBtn')?.addEventListener('click', switchCamera);
        }
    }

    function addVideoToGrid(id, stream, label) {
        const grid = document.getElementById('videoGrid');
        if (!grid || document.getElementById(`video-${id}`)) return;
        const card = document.createElement('div');
        card.className = 'video-card';
        card.id = `video-card-${id}`;
        const video = document.createElement('video');
        video.id = `video-${id}`;
        video.autoplay = true;
        video.playsInline = true;
        video.srcObject = stream;
        const labelSpan = document.createElement('div');
        labelSpan.className = 'video-label';
        labelSpan.innerText = label;
        card.appendChild(video);
        card.appendChild(labelSpan);
        grid.appendChild(card);
    }
    function removeVideoFromGrid(id) {
        const card = document.getElementById(`video-card-${id}`);
        if (card) card.remove();
    }
    function updateMemberListUI() {
        const container = document.getElementById('memberList');
        if (!container) return;
        let html = '';
        for (let [peerId, info] of members) {
            const muteIcon = info.muted ? '🔇' : '🎤';
            html += `<div class="member-chip">
                        <span>👤 ${info.name}</span> <span class="mute-indicator">${muteIcon}</span>
                        ${myRole === 'host' && peerId !== myPeer.id ? `
                            <button style="margin-left:6px; background:none; border:none;" onclick="muteStudent('${peerId}')">🔇</button>
                            <button style="margin-left:2px; background:none; border:none; color:#e67e22;" onclick="removeStudent('${peerId}')">🚷</button>
                        ` : ''}
                      </div>`;
        }
        container.innerHTML = html || '<div>暂无其他成员</div>';
    }
    window.muteStudent = (studentId) => {
        const dc = dataConnections.get(studentId);
        if (dc && dc.open) dc.send({ type: 'mute' });
        if (members.has(studentId)) members.get(studentId).muted = true;
        updateMemberListUI();
    };
    window.removeStudent = (studentId) => {
        const dc = dataConnections.get(studentId);
        if (dc && dc.open) dc.send({ type: 'remove' });
        const call = connections.get(studentId);
        if (call) call.close();
        connections.delete(studentId);
        dataConnections.delete(studentId);
        members.delete(studentId);
        updateMemberListUI();
        removeVideoFromGrid(studentId);
    };
    function muteAllStudents() {
        for (let [peerId] of members) {
            if (peerId !== myPeer.id) muteStudent(peerId);
        }
    }
    function toggleMic() {
        const audioTrack = localStream?.getAudioTracks()[0];
        if (audioTrack) {
            audioTrack.enabled = !audioTrack.enabled;
            const btn = document.getElementById('toggleMicBtn');
            if (btn) btn.innerHTML = audioTrack.enabled ? '🎤 麦克风开' : '🎤 麦克风关';
        }
    }
    function toggleCam() {
        const videoTrack = localStream?.getVideoTracks()[0];
        if (videoTrack) {
            videoTrack.enabled = !videoTrack.enabled;
            const btn = document.getElementById('toggleCamBtn');
            if (btn) btn.innerHTML = videoTrack.enabled ? '📷 摄像头开' : '📷 摄像头关';
        }
    }
    async function switchCamera() {
        if (!localStream) return;
        const oldVideoTrack = localStream.getVideoTracks()[0];
        if (oldVideoTrack) oldVideoTrack.stop();
        currentFacing = currentFacing === 'user' ? 'environment' : 'user';
        try {
            const newStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: currentFacing } },
                audio: true
            });
            const newVideoTrack = newStream.getVideoTracks()[0];
            const oldAudio = localStream.getAudioTracks()[0];
            localStream = newStream;
            if (oldAudio) localStream.addTrack(oldAudio);
            const selfVideo = document.querySelector('#video-self');
            if (selfVideo) selfVideo.srcObject = localStream;
            for (let [peerId, call] of connections) {
                if (call.peerConnection) {
                    const senders = call.peerConnection.getSenders();
                    const videoSender = senders.find(s => s.track && s.track.kind === 'video');
                    if (videoSender) videoSender.replaceTrack(newVideoTrack);
                }
            }
        } catch (err) {
            console.warn('切换摄像头失败', err);
            alert('无法切换摄像头，可能没有后置摄像头');
            currentFacing = currentFacing === 'user' ? 'environment' : 'user';
        }
    }
    async function startScreenShare() {
        if (!navigator.mediaDevices.getDisplayMedia) {
            alert('您的设备不支持屏幕共享功能（仅限电脑端使用）');
            return;
        }
        if (!screenStream && localStream) {
            try {
                const screen = await navigator.mediaDevices.getDisplayMedia({ video: true });
                screenStream = screen;
                const screenTrack = screen.getVideoTracks()[0];
                for (let [peerId, call] of connections) {
                    if (call.peerConnection) {
                        const senders = call.peerConnection.getSenders();
                        const videoSender = senders.find(s => s.track && s.track.kind === 'video');
                        if (videoSender) videoSender.replaceTrack(screenTrack);
                    }
                }
                const selfVideo = document.querySelector('#video-self');
                if (selfVideo && localStream) {
                    const oldVideo = localStream.getVideoTracks()[0];
                    if (oldVideo) localStream.removeTrack(oldVideo);
                    localStream.addTrack(screenTrack);
                    selfVideo.srcObject = localStream;
                }
                const shareBtn = document.getElementById('shareScreenBtn');
                if (shareBtn) shareBtn.style.display = 'none';
                const stopBtn = document.createElement('button');
                stopBtn.className = 'ctrl-btn';
                stopBtn.id = 'stopShareBtn';
                stopBtn.innerHTML = '🛑 停止共享';
                stopBtn.onclick = stopScreenShare;
                document.getElementById('controlBar').appendChild(stopBtn);
                screenTrack.onended = () => stopScreenShare();
            } catch(e) { console.warn(e); }
        }
    }
    async function stopScreenShare() {
        if (screenStream) {
            screenStream.getTracks().forEach(t => t.stop());
            screenStream = null;
            const camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            const camTrack = camStream.getVideoTracks()[0];
            for (let [peerId, call] of connections) {
                if (call.peerConnection) {
                    const senders = call.peerConnection.getSenders();
                    const videoSender = senders.find(s => s.track && s.track.kind === 'video');
                    if (videoSender) videoSender.replaceTrack(camTrack);
                }
            }
            if (localStream) {
                const oldVideo = localStream.getVideoTracks()[0];
                if (oldVideo) localStream.removeTrack(oldVideo);
                localStream.addTrack(camTrack);
                const selfVideo = document.querySelector('#video-self');
                if (selfVideo) selfVideo.srcObject = localStream;
            }
            const shareBtn = document.getElementById('shareScreenBtn');
            if (shareBtn) shareBtn.style.display = 'inline-flex';
            const stopBtn = document.getElementById('stopShareBtn');
            if (stopBtn) stopBtn.remove();
        }
    }
    function leaveRoom() {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
        if (myPeer) myPeer.destroy();
        renderLanding();
    }
    function renderLanding() {
        document.getElementById('appRoot').innerHTML = `
            <div class="landing-grid">
                <div class="glass-card entry-card" id="createCourseCard">
                    <div class="entry-icon">🎓</div>
                    <div class="entry-title">创建课程</div>
                    <div class="entry-desc">成为主持人，拥有课堂管理权限<br>生成专属12位课程密钥</div>
                    <button class="join-btn" style="background:#2c3e66;">✨ 创建新课</button>
                </div>
                <div class="glass-card entry-card" id="joinCourseCard">
                    <div class="entry-icon">📚</div>
                    <div class="entry-title">加入课程</div>
                    <div class="entry-desc">输入12位密钥，进入课堂学习</div>
                    <div class="join-input-group">
                        <input type="text" id="courseKeyInput" placeholder="12位数字密钥" maxlength="12" autocomplete="off">
                        <button class="join-btn" id="joinSubmitBtn">加入</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('createCourseCard')?.addEventListener('click', onCreateCourse);
        document.getElementById('joinSubmitBtn')?.addEventListener('click', onJoinCourse);
        const keyInput = document.getElementById('courseKeyInput');
        if (keyInput) keyInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') onJoinCourse(); });
    }
    renderLanding();
</script>
</body>
</html>
