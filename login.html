<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - AI平台</title>
  <!-- Cloudflare Turnstile 官方脚本 -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, 'Microsoft YaHei', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 30px;
      text-align: center;
      color: #ffffff;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .header p {
      opacity: 0.9;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid #f1f5f9;
    }
    .tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      color: #64748b;
      transition: all 0.3s ease;
    }
    .tab.active {
      color: #667eea;
      border-bottom: 3px solid #667eea;
    }
    .form-body {
      padding: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-weight: 500;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .code-row {
      display: flex;
      gap: 10px;
    }
    .code-row input {
      flex: 1;
    }
    .code-row button {
      width: 120px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    .btn-primary:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #64748b;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .btn-secondary:disabled {
      background: #f8fafc;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .link-group {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }
    .link {
      color: #667eea;
      cursor: pointer;
      text-decoration: none;
    }
    .link:hover {
      text-decoration: underline;
    }
    .form-panel {
      display: none;
    }
    .form-panel.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: #ffffff;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      animation: fadeIn 0.3s ease;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 {
      font-size: 20px;
      color: #334155;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #94a3b8;
      line-height: 1;
    }
    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
    }
    .message.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .message.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .turnstile-container {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>AI平台</h1>
      <p>智能聊天 · AI生图 · 一站式体验</p>
    </div>

    <!-- 登录方式标签 -->
    <div class="tabs">
      <div class="tab active" data-tab="password">密码登录</div>
      <div class="tab" data-tab="code">验证码登录</div>
    </div>

    <div class="form-body">
      <div id="global-message"></div>

      <!-- 密码登录面板 -->
      <div class="form-panel active" id="password-panel">
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="login-email" placeholder="请输入您的邮箱地址">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="login-password" placeholder="请输入您的密码">
        </div>
        <button class="btn btn-primary" id="login-password-btn">立即登录</button>
        <div class="link-group">
          <span class="link" id="register-link">注册账号</span>
          <span class="link" id="reset-link">忘记密码</span>
        </div>
      </div>

      <!-- 验证码登录面板 -->
      <div class="form-panel" id="code-panel">
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="code-email" placeholder="请输入您的邮箱地址">
        </div>
        <!-- Cloudflare人机验证容器 -->
        <div class="turnstile-container" id="code-turnstile"></div>
        <div class="form-group">
          <label>邮箱验证码</label>
          <div class="code-row">
            <input type="text" id="login-code" placeholder="请输入6位验证码" maxlength="6">
            <button class="btn btn-secondary" id="send-code-btn">获取验证码</button>
          </div>
        </div>
        <button class="btn btn-primary" id="login-code-btn">立即登录</button>
        <div class="link-group">
          <span class="link" id="register-link2">注册账号</span>
          <span class="link" id="reset-link2">忘记密码</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 注册账号模态框 -->
  <div class="modal" id="register-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>注册账号</h2>
        <button class="close-btn" id="register-close">&times;</button>
      </div>
      <div id="register-message"></div>
      <div class="form-group">
        <label>邮箱</label>
        <input type="email" id="register-email" placeholder="请输入您的邮箱地址">
      </div>
      <!-- Cloudflare人机验证容器 -->
      <div class="turnstile-container" id="register-turnstile"></div>
      <div class="form-group">
        <label>邮箱验证码</label>
        <div class="code-row">
          <input type="text" id="register-code" placeholder="请输入6位验证码" maxlength="6">
          <button class="btn btn-secondary" id="register-send-code-btn">获取验证码</button>
        </div>
      </div>
      <div class="form-group">
        <label>设置密码</label>
        <input type="password" id="register-password" placeholder="请设置6-20位密码">
      </div>
      <button class="btn btn-primary" id="register-btn">完成注册</button>
    </div>
  </div>

  <!-- 重置密码模态框 -->
  <div class="modal" id="reset-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>重置密码</h2>
        <button class="close-btn" id="reset-close">&times;</button>
      </div>
      <div id="reset-message"></div>
      <div class="form-group">
        <label>邮箱</label>
        <input type="email" id="reset-email" placeholder="请输入您的邮箱地址">
      </div>
      <!-- Cloudflare人机验证容器 -->
      <div class="turnstile-container" id="reset-turnstile"></div>
      <div class="form-group">
        <label>邮箱验证码</label>
        <div class="code-row">
          <input type="text" id="reset-code" placeholder="请输入6位验证码" maxlength="6">
          <button class="btn btn-secondary" id="reset-send-code-btn">获取验证码</button>
        </div>
      </div>
      <div class="form-group">
        <label>新密码</label>
        <input type="password" id="reset-password" placeholder="请设置6-20位新密码">
      </div>
      <button class="btn btn-primary" id="reset-btn">重置密码</button>
    </div>
  </div>

  <script>
    // 全局配置
    const API_BASE = 'http://101.32.215.93:3000/api';
    const TURNSTILE_SITE_KEY = '0x4AAAAAACyGeLsKIbpjbRer';
    // 存储Turnstile组件ID
    let turnstileWidgets = {};

    // 页面完全加载后执行
    window.onload = () => {
      // 检查是否已登录
      if (localStorage.getItem('token')) {
        window.location.href = 'index.html';
        return;
      }

      // 等待Turnstile脚本加载完成后，初始化所有验证组件
      window.onloadTurnstileCallback = () => {
        turnstileWidgets.code = turnstile.render('#code-turnstile', {
          sitekey: TURNSTILE_SITE_KEY,
          theme: 'light',
          size: 'normal'
        });
        turnstileWidgets.register = turnstile.render('#register-turnstile', {
          sitekey: TURNSTILE_SITE_KEY,
          theme: 'light',
          size: 'normal'
        });
        turnstileWidgets.reset = turnstile.render('#reset-turnstile', {
          sitekey: TURNSTILE_SITE_KEY,
          theme: 'light',
          size: 'normal'
        });
        console.log('✅ Cloudflare Turnstile 组件初始化完成');
      };

      // 标签切换逻辑
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          // 移除所有激活状态
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
          // 激活当前标签
          tab.classList.add('active');
          document.getElementById(`${tab.dataset.tab}-panel`).classList.add('active');
        });
      });

      // 模态框控制
      const openModal = (id) => {
        document.getElementById(id).classList.add('active');
        // 重置对应验证组件
        if (id === 'register-modal') turnstile.reset(turnstileWidgets.register);
        if (id === 'reset-modal') turnstile.reset(turnstileWidgets.reset);
      };
      const closeModal = (id) => {
        document.getElementById(id).classList.remove('active');
      };

      // 注册模态框开关
      document.getElementById('register-link').addEventListener('click', () => openModal('register-modal'));
      document.getElementById('register-link2').addEventListener('click', () => openModal('register-modal'));
      document.getElementById('register-close').addEventListener('click', () => closeModal('register-modal'));

      // 重置密码模态框开关
      document.getElementById('reset-link').addEventListener('click', () => openModal('reset-modal'));
      document.getElementById('reset-link2').addEventListener('click', () => openModal('reset-modal'));
      document.getElementById('reset-close').addEventListener('click', () => closeModal('reset-modal'));

      // 全局消息提示
      const showMessage = (id, text, type) => {
        const el = document.getElementById(id);
        el.innerHTML = `<div class="message ${type}">${text}</div>`;
        setTimeout(() => {
          el.innerHTML = '';
        }, 4000);
      };

      // 倒计时函数
      const startCountDown = (btn, seconds = 60) => {
        let count = seconds;
        btn.disabled = true;
        btn.innerText = `${count}秒后重发`;
        const timer = setInterval(() => {
          count--;
          btn.innerText = `${count}秒后重发`;
          if (count <= 0) {
            clearInterval(timer);
            btn.disabled = false;
            btn.innerText = '获取验证码';
          }
        }, 1000);
      };

      // ===================== 验证码发送逻辑 =====================
      // 登录页验证码发送
      document.getElementById('send-code-btn').addEventListener('click', async () => {
        const email = document.getElementById('code-email').value.trim();
        const sendBtn = document.getElementById('send-code-btn');
        // 获取Turnstile验证token
        const turnstileToken = turnstile.getResponse(turnstileWidgets.code);

        // 校验
        if (!email) {
          showMessage('global-message', '请先输入邮箱地址', 'error');
          return;
        }
        if (!turnstileToken) {
          showMessage('global-message', '请先完成人机验证', 'error');
          return;
        }

        // 禁用按钮
        sendBtn.disabled = true;

        try {
          // 调用发送验证码接口
          const res = await fetch(`${API_BASE}/send-email-code`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: email,
              turnstileToken: turnstileToken,
              type: 'login'
            })
          });
          const data = await res.json();

          if (data.success) {
            showMessage('global-message', data.message, 'success');
            startCountDown(sendBtn);
            // 重置验证组件
            turnstile.reset(turnstileWidgets.code);
          } else {
            showMessage('global-message', data.message, 'error');
            sendBtn.disabled = false;
            turnstile.reset(turnstileWidgets.code);
          }
        } catch (err) {
          console.error('发送验证码失败:', err);
          showMessage('global-message', '网络异常，请检查网络后重试', 'error');
          sendBtn.disabled = false;
        }
      });

      // 注册页验证码发送
      document.getElementById('register-send-code-btn').addEventListener('click', async () => {
        const email = document.getElementById('register-email').value.trim();
        const sendBtn = document.getElementById('register-send-code-btn');
        const turnstileToken = turnstile.getResponse(turnstileWidgets.register);

        if (!email) {
          showMessage('register-message', '请先输入邮箱地址', 'error');
          return;
        }
        if (!turnstileToken) {
          showMessage('register-message', '请先完成人机验证', 'error');
          return;
        }

        sendBtn.disabled = true;

        try {
          const res = await fetch(`${API_BASE}/send-email-code`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: email,
              turnstileToken: turnstileToken,
              type: 'register'
            })
          });
          const data = await res.json();

          if (data.success) {
            showMessage('register-message', data.message, 'success');
            startCountDown(sendBtn);
            turnstile.reset(turnstileWidgets.register);
          } else {
            showMessage('register-message', data.message, 'error');
            sendBtn.disabled = false;
            turnstile.reset(turnstileWidgets.register);
          }
        } catch (err) {
          console.error('发送验证码失败:', err);
          showMessage('register-message', '网络异常，请检查网络后重试', 'error');
          sendBtn.disabled = false;
        }
      });

      // 重置密码验证码发送
      document.getElementById('reset-send-code-btn').addEventListener('click', async () => {
        const email = document.getElementById('reset-email').value.trim();
        const sendBtn = document.getElementById('reset-send-code-btn');
        const turnstileToken = turnstile.getResponse(turnstileWidgets.reset);

        if (!email) {
          showMessage('reset-message', '请先输入邮箱地址', 'error');
          return;
        }
        if (!turnstileToken) {
          showMessage('reset-message', '请先完成人机验证', 'error');
          return;
        }

        sendBtn.disabled = true;

        try {
          const res = await fetch(`${API_BASE}/send-email-code`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: email,
              turnstileToken: turnstileToken,
              type: 'reset'
            })
          });
          const data = await res.json();

          if (data.success) {
            showMessage('reset-message', data.message, 'success');
            startCountDown(sendBtn);
            turnstile.reset(turnstileWidgets.reset);
          } else {
            showMessage('reset-message', data.message, 'error');
            sendBtn.disabled = false;
            turnstile.reset(turnstileWidgets.reset);
          }
        } catch (err) {
          console.error('发送验证码失败:', err);
          showMessage('reset-message', '网络异常，请检查网络后重试', 'error');
          sendBtn.disabled = false;
        }
      });

      // ===================== 登录/注册/重置逻辑 =====================
      // 密码登录
      document.getElementById('login-password-btn').addEventListener('click', async () => {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const loginBtn = document.getElementById('login-password-btn');

        if (!email || !password) {
          showMessage('global-message', '请输入邮箱和密码', 'error');
          return;
        }

        loginBtn.disabled = true;
        loginBtn.innerText = '登录中...';

        try {
          const res = await fetch(`${API_BASE}/login-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();

          if (data.success) {
            showMessage('global-message', '登录成功，正在跳转...', 'success');
            // 存储登录信息
            localStorage.setItem('token', data.data.token);
            localStorage.setItem('user', JSON.stringify(data.data.user));
            // 跳转主页
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 1000);
          } else {
            showMessage('global-message', data.message, 'error');
            loginBtn.disabled = false;
            loginBtn.innerText = '立即登录';
          }
        } catch (err) {
          console.error('登录失败:', err);
          showMessage('global-message', '网络异常，请检查网络后重试', 'error');
          loginBtn.disabled = false;
          loginBtn.innerText = '立即登录';
        }
      });

      // 验证码登录
      document.getElementById('login-code-btn').addEventListener('click', async () => {
        const email = document.getElementById('code-email').value.trim();
        const code = document.getElementById('login-code').value.trim();
        const loginBtn = document.getElementById('login-code-btn');

        if (!email || !code) {
          showMessage('global-message', '请输入邮箱和验证码', 'error');
          return;
        }

        loginBtn.disabled = true;
        loginBtn.innerText = '登录中...';

        try {
          const res = await fetch(`${API_BASE}/login-code`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code })
          });
          const data = await res.json();

          if (data.success) {
            showMessage('global-message', '登录成功，正在跳转...', 'success');
            localStorage.setItem('token', data.data.token);
            localStorage.setItem('user', JSON.stringify(data.data.user));
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 1000);
          } else {
            showMessage('global-message', data.message, 'error');
            loginBtn.disabled = false;
            loginBtn.innerText = '立即登录';
          }
        } catch (err) {
          console.error('登录失败:', err);
          showMessage('global-message', '网络异常，请检查网络后重试', 'error');
          loginBtn.disabled = false;
          loginBtn.innerText = '立即登录';
        }
      });

      // 注册账号
      document.getElementById('register-btn').addEventListener('click', async () => {
        const email = document.getElementById('register-email').value.trim();
        const code = document.getElementById('register-code').value.trim();
        const password = document.getElementById('register-password').value;
        const registerBtn = document.getElementById('register-btn');

        if (!email || !code || !password) {
          showMessage('register-message', '请填写完整的注册信息', 'error');
          return;
        }
        if (password.length < 6) {
          showMessage('register-message', '密码长度不能少于6位', 'error');
          return;
        }

        registerBtn.disabled = true;
        registerBtn.innerText = '注册中...';

        try {
          const res = await fetch(`${API_BASE}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, code })
          });
          const data = await res.json();

          if (data.success) {
            showMessage('register-message', data.message, 'success');
            setTimeout(() => {
              closeModal('register-modal');
            }, 1500);
          } else {
            showMessage('register-message', data.message, 'error');
            registerBtn.disabled = false;
            registerBtn.innerText = '完成注册';
          }
        } catch (err) {
          console.error('注册失败:', err);
          showMessage('register-message', '网络异常，请检查网络后重试', 'error');
          registerBtn.disabled = false;
          registerBtn.innerText = '完成注册';
        }
      });

      // 重置密码
      document.getElementById('reset-btn').addEventListener('click', async () => {
        const email = document.getElementById('reset-email').value.trim();
        const code = document.getElementById('reset-code').value.trim();
        const newPassword = document.getElementById('reset-password').value;
        const resetBtn = document.getElementById('reset-btn');

        if (!email || !code || !newPassword) {
          showMessage('reset-message', '请填写完整信息', 'error');
          return;
        }
        if (newPassword.length < 6) {
          showMessage('reset-message', '新密码长度不能少于6位', 'error');
          return;
        }

        resetBtn.disabled = true;
        resetBtn.innerText = '重置中...';

        try {
          const res = await fetch(`${API_BASE}/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, newPassword, code })
          });
          const data = await res.json();

          if (data.success) {
            showMessage('reset-message', data.message, 'success');
            setTimeout(() => {
              closeModal('reset-modal');
            }, 1500);
          } else {
            showMessage('reset-message', data.message, 'error');
            resetBtn.disabled = false;
            resetBtn.innerText = '重置密码';
          }
        } catch (err) {
          console.error('重置密码失败:', err);
          showMessage('reset-message', '网络异常，请检查网络后重试', 'error');
          resetBtn.disabled = false;
          resetBtn.innerText = '重置密码';
        }
      });

      // 回车登录
      document.getElementById('login-password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('login-password-btn').click();
      });
      document.getElementById('login-code').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('login-code-btn').click();
      });
    };
  </script>
</body>
</html>
